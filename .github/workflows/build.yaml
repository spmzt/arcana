name: FreeBSD OCI Image

# By hand only for now (2026-10-11): the images are a 16.0-CURRENT
# userland and the action's VM a 15.1 kernel, so the test suite cannot
# pass inside the container (docs/TODO.md, known limits). Put the push
# and pull_request triggers back once the images match a release:
#
#   push:
#     branches: [ "main" ]
#     tags: [ "v*" ]
#   pull_request:
#     branches: [ "main" ]
on:
  workflow_dispatch:

# Each job asks for what it needs; nothing by default.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3
        with:
          remove_tool_cache: true
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox mono-complete"
          remove_packages_one_command: true
          rm_cmd: rmz

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      # The image build compiles arcana and runs its test suite, so a
      # pull request is checked the same way; only pushes publish the
      # image.
      - name: build oci image
        uses: vmactions/freebsd-vm@b84ab5559b5a1bb4b8ee2737d2506a16e1737636 # v1.4.8
        env:
          AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
          REGISTRY: ghcr.io
          IMAGE: ghcr.io/${{ github.repository_owner }}/arcana
          PUBLISH: ${{ github.event_name != 'pull_request' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        with:
          usesh: true
          #debug-on-error: true
          #vnc-password: ${{ secrets.VNC_PASSWORD }}
          envs: "AUTH_TOKEN USERNAME REGISTRY IMAGE PUBLISH REF_TYPE REF_NAME"
          prepare: |
            pkg install -y podman-suite
          run: |
            set -eu
            # latest and the date, as in spmzt/images; a v* tag adds its
            # version (v1.0.0 -> 1.0.0).
            tags="${IMAGE}:$(date -I)"
            if [ "${REF_TYPE}" = tag ]; then
                tags="${tags} ${IMAGE}:${REF_NAME#v}"
            else
                tags="${tags} ${IMAGE}:latest"
            fi
            set --
            for t in ${tags}; do
                set -- "$@" -t "${t}"
            done
            buildah build -f Containerfile --network=host --layers "$@" .
            if [ "${PUBLISH}" = true ]; then
                echo "${AUTH_TOKEN}" | buildah login "${REGISTRY}" \
                    -u "${USERNAME}" --password-stdin
                for t in ${tags}; do
                    buildah push "${t}"
                done
            fi
