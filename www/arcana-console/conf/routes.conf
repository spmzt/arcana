# A query parameter as it came: Kore hands a handler only what a route
# declares (http_argument_get_string), with a validator each.
validator	v_qs	regex	^.*$

# Routes of the arcana console, included by kore.conf.  The handlers
# are in arcana-console.so.  Exact routes come before the static filemap.

route /api/health {
	handler		api_health
	methods		get
}
route /.well-known/assetlinks.json {
	handler		api_assetlinks
	methods		get
}
route /api/auth/status {
	handler		api_auth_status
	methods		get
}
route /api/auth/register/begin {
	handler		api_register_begin
	methods		post
}
route /api/auth/register/finish {
	handler		api_register_finish
	methods		post
}
route /api/auth/login/begin {
	handler		api_login_begin
	methods		post
}
route /api/auth/login/finish {
	handler		api_login_finish
	methods		post
}
route /api/auth/logout {
	handler		api_logout
	methods		post
}
route /api/auth/credentials {
	handler		api_credentials
	methods		get
}
route ^/api/auth/credentials/([A-Za-z0-9_-]+)$ {
	handler		api_credential
	methods		delete
}
route /api/servers {
	handler		api_servers
	methods		get post
}
route /api/update/notes {
	handler		api_update_notes
	methods		get
	validate	qs:get component v_qs
	validate	qs:get from v_qs
	validate	qs:get to v_qs
	validate	qs:get fresh v_qs
}
route /api/update {
	handler		api_update
	methods		get
}
route /api/enrol/tokens {
	handler		api_enrol_tokens
	methods		post
}
route /api/enrol {
	handler		api_enrol
	methods		post
}
route ^/api/servers/([0-9a-f]+)$ {
	handler		api_server
	methods		post delete
}
route ^/api/servers/([0-9a-f]+)/hello$ {
	handler		api_hello
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/jails$ {
	handler		api_jails
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/jails/([A-Za-z0-9_][A-Za-z0-9_.-]*)/action$ {
	handler		api_action
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/jails/([A-Za-z0-9_][A-Za-z0-9_.-]*)/address$ {
	handler		api_address
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/services$ {
	handler		api_services
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/services/([A-Za-z0-9_][A-Za-z0-9_.-]*)/action$ {
	handler		api_service_action
	on_free		api_call_free
	methods		post
}
route /api/push {
	handler		api_push
	methods		get
}
route /api/push/subscribe {
	handler		api_push_subscribe
	methods		post
}
route /api/push/unsubscribe {
	handler		api_push_subscribe
	methods		post
}
route /api/push/send {
	handler		api_push_send
	on_free		api_push_free
	methods		post
}
route /api/workflows {
	handler		api_workflows
	methods		get post
}
route ^/api/workflows/[0-9a-f]{8}$ {
	handler		api_workflows
	methods		delete
}
route ^/api/workflows/[0-9a-f]{8}/run$ {
	handler		api_workflows
	methods		post
}
route /api/sdwan {
	handler		api_sdwan
	methods		get put
}
route /api/sdwan/check {
	handler		api_sdwan
	methods		post
}
route /api/sdwan/plan {
	handler		api_sdwan_edges
	methods		get
}
route /api/sdwan/apply {
	handler		api_sdwan_edges
	methods		get post
}
route /api/sdwan/steer {
	handler		api_sdwan_edges
	methods		get
}
route /api/sdwan/rekey {
	handler		api_sdwan_rekey
	methods		get post
}
route /api/sdwan/lists {
	handler		api_sdwan_lists
	methods		get put
}
route /api/sdwan/lists/fetch {
	handler		api_sdwan_lists
	methods		post
}
route /api/sdwan/identities {
	handler		api_sdwan_identities
	methods		get post delete
	validate	qs:get swvc v_qs
	validate	qs:get end_point v_qs
	validate	qs:get name v_qs
	validate	qs:delete swvc v_qs
	validate	qs:delete end_point v_qs
	validate	qs:delete name v_qs
}
route /api/sdwan/record {
	handler		api_sdwan_record
	methods		get
	validate	qs:get swvc v_qs
	validate	qs:get policy v_qs
	validate	qs:get edge v_qs
	validate	qs:get since v_qs
}
route /api/sdwan/record.csv {
	handler		api_sdwan_record
	methods		get
	validate	qs:get swvc v_qs
	validate	qs:get policy v_qs
	validate	qs:get edge v_qs
	validate	qs:get since v_qs
}
route /api/runs {
	handler		api_runs
	methods		get
}
route ^/api/runs/[0-9]+$ {
	handler		api_runs
	methods		get delete
}
route /api/transfers {
	handler		api_transfers
	methods		get post
}
route ^/api/transfers/[0-9]+$ {
	handler		api_transfers
	methods		delete
}
route /api/tokens {
	handler		api_tokens
	methods		get post
}
route ^/api/tokens/[0-9a-f]{16}$ {
	handler		api_tokens
	methods		delete
}
route /api/settings {
	handler		api_settings
	methods		get post
}
route ^/api/servers/([0-9a-f]+)/console-update$ {
