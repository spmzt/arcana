# Routes of the arcana console, included by kore.conf.  The handlers
# are in arcana-console.so.  Exact routes come before the static filemap.

route /api/health {
	handler		api_health
	methods		get
}
route /api/auth/status {
	handler		api_auth_status
	methods		get
}
route /api/auth/register/begin {
	handler		api_register_begin
	methods		post
}
route /api/auth/register/finish {
	handler		api_register_finish
	methods		post
}
route /api/auth/login/begin {
	handler		api_login_begin
	methods		post
}
route /api/auth/login/finish {
	handler		api_login_finish
	methods		post
}
route /api/auth/logout {
	handler		api_logout
	methods		post
}
route /api/auth/credentials {
	handler		api_credentials
	methods		get
}
route ^/api/auth/credentials/([A-Za-z0-9_-]+)$ {
	handler		api_credential
	methods		delete
}
route /api/servers {
	handler		api_servers
	methods		get post
}
route /api/update {
	handler		api_update
	methods		get
}
route /api/enrol/tokens {
	handler		api_enrol_tokens
	methods		post
}
route /api/enrol {
	handler		api_enrol
	methods		post
}
route ^/api/servers/([0-9a-f]+)$ {
	handler		api_server
	methods		delete
}
route ^/api/servers/([0-9a-f]+)/hello$ {
	handler		api_hello
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/jails$ {
	handler		api_jails
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/jails/([A-Za-z0-9_][A-Za-z0-9_.-]*)/action$ {
	handler		api_action
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/jails/([A-Za-z0-9_][A-Za-z0-9_.-]*)/address$ {
	handler		api_address
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/services$ {
	handler		api_services
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/services/([A-Za-z0-9_][A-Za-z0-9_.-]*)/action$ {
	handler		api_service_action
	on_free		api_call_free
	methods		post
}
route /api/push {
	handler		api_push
	methods		get
}
route /api/push/subscribe {
	handler		api_push_subscribe
	methods		post
}
route /api/push/unsubscribe {
	handler		api_push_subscribe
	methods		post
}
route /api/push/send {
	handler		api_push_send
	on_free		api_push_free
	methods		post
}
route /api/settings {
	handler		api_settings
	methods		get post
}
route ^/api/servers/([0-9a-f]+)/console-update$ {
	handler		api_agent_build
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/agent-build$ {
	handler		api_agent_build
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/agent-update$ {
	handler		api_agent_update
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/services/([A-Za-z0-9_][A-Za-z0-9_.-]*)/config$ {
	handler		api_service_config
	on_free		api_call_free
	methods		get post
}
route ^/api/servers/([0-9a-f]+)/net/(routes|nexthops|connections|sockets|interfaces|netgraph|wireguard|bird|bird-routes|lookup)$ {
	handler		api_network
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/bird/config$ {
	handler		api_bird_config
	on_free		api_call_free
	methods		get post
}
route ^/api/servers/([0-9a-f]+)/storage/(disks|pools|datasets|snapshots|mounts|importable)$ {
	handler		api_storage
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/fstab$ {
	handler		api_fstab
	on_free		api_call_free
	methods		get post
}
route ^/api/servers/([0-9a-f]+)/kernel$ {
	handler		api_kernel
	on_free		api_call_free
	methods		get
}
route /api/stream {
	handler		api_stream
	methods		get
}
route ^/api/servers/([0-9a-f]+)/sysctl$ {
	handler		api_sysctl
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/transport$ {
	handler		api_transport
	on_free		api_call_free
	methods		get post
}
route ^/api/servers/([0-9a-f]+)/transport/switch$ {
	handler		api_transport_switch
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/stats$ {
	handler		api_stats
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/packages$ {
	handler		api_packages
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/packages/upgrade$ {
	handler		api_pkg_upgrade
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/jobs$ {
	handler		api_jobs
	on_free		api_call_free
	methods		get post
}
route ^/api/servers/([0-9a-f]+)/jobs/([0-9]+)$ {
	handler		api_job
	on_free		api_call_free
	methods		get delete
}
