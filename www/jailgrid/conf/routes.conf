# Routes of the jailgrid console, included by kore.conf.  The handlers
# are in jailgrid.so.  Exact routes come before the static filemap.

route /api/health {
	handler		api_health
	methods		get
}
route /api/auth/status {
	handler		api_auth_status
	methods		get
}
route /api/auth/register/begin {
	handler		api_register_begin
	methods		post
}
route /api/auth/register/finish {
	handler		api_register_finish
	methods		post
}
route /api/auth/login/begin {
	handler		api_login_begin
	methods		post
}
route /api/auth/login/finish {
	handler		api_login_finish
	methods		post
}
route /api/auth/logout {
	handler		api_logout
	methods		post
}
route /api/auth/credentials {
	handler		api_credentials
	methods		get
}
route ^/api/auth/credentials/([A-Za-z0-9_-]+)$ {
	handler		api_credential
	methods		delete
}
route /api/servers {
	handler		api_servers
	methods		get post
}
route /api/update {
	handler		api_update
	methods		get
}
route /api/enrol/tokens {
	handler		api_enrol_tokens
	methods		post
}
route /api/enrol {
	handler		api_enrol
	methods		post
}
route ^/api/servers/([0-9a-f]+)$ {
	handler		api_server
	methods		delete
}
route ^/api/servers/([0-9a-f]+)/hello$ {
	handler		api_hello
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/jails$ {
	handler		api_jails
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/jails/([A-Za-z0-9_][A-Za-z0-9_.-]*)/action$ {
	handler		api_action
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/jails/([A-Za-z0-9_][A-Za-z0-9_.-]*)/address$ {
	handler		api_address
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/services$ {
	handler		api_services
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/services/([A-Za-z0-9_][A-Za-z0-9_.-]*)/action$ {
	handler		api_service_action
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/services/([A-Za-z0-9_][A-Za-z0-9_.-]*)/config$ {
	handler		api_service_config
	on_free		api_call_free
	methods		get post
}
route ^/api/servers/([0-9a-f]+)/net/(routes|nexthops|connections|sockets)$ {
	handler		api_network
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/stats$ {
	handler		api_stats
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/packages$ {
	handler		api_packages
	on_free		api_call_free
	methods		get
}
route ^/api/servers/([0-9a-f]+)/packages/upgrade$ {
	handler		api_pkg_upgrade
	on_free		api_call_free
	methods		post
}
route ^/api/servers/([0-9a-f]+)/jobs$ {
	handler		api_jobs
	on_free		api_call_free
	methods		get post
}
route ^/api/servers/([0-9a-f]+)/jobs/([0-9]+)$ {
	handler		api_job
	on_free		api_call_free
	methods		get delete
}
