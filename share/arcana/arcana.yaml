# SPDX-License-Identifier: BSD-2-Clause
---
name: arcana
version: 1
c-prefix: arc
doc: |
  What the programs keep of a host for their own use: a jail, a
  service, a job and the change it makes, and the kinds and limits
  they are named by.  No family speaks it: the interim family it was
  is gone, its operations each a YANG module's now (share/yang).

definitions:
  - name: max-steps
    type: const
    value: 1024
  - name: max-batch
    type: const
    value: 64
  - name: job-kind
    type: enum
    entries:
      - name: jail-action
        doc: jail and action, as the action operation.
      - name: address
        doc: As the address operation, without dry-run.
      - name: service-action
      - name: service-config
        doc: service and variables to set or unset.
      - name: pkg-upgrade
      - name: if-address
        doc: |
          With interface and address, add the address to the interface
          as an alias, or with remove take it off.  Live, with
          ifconfig(8); with persist, also in rc.conf, as the next
          ifconfig_<interface>_alias<n>, which stay without gaps.
      - name: if-state
        doc: With interface and up, bring the interface up or down.
      - name: route
        doc: |
          With destination and gateway, add a static route, or with
          remove delete it, in the routing table fib names.  Live, with
          route(8); with persist, also in rc.conf (static_routes).
      - name: if-set
        doc: |
          With interface, set its mtu, its description, or both; an
          empty description takes it off.  With persist, also in rc.conf.
      - name: if-create
        doc: |
          Create the cloned interface named by interface, a name with
          its unit (gif0) or a type alone (gif), of one of the types the
          daemon knows.  tunnel-local and tunnel-remote are a tunnel's
          outer ends, address and destination its inner ones, id a VLAN
          tag or a VXLAN identifier, parent the interface a VLAN rides
          or a bridge's first member.  What cannot be finished is
          destroyed again.  With persist, also in rc.conf.
      - name: if-destroy
        doc: Destroy a cloned interface; with persist, forget it in rc.conf.
      - name: netgraph
        doc: |
          Change the netgraph(4) graph with ngctl(8).  verb is one of
          mkpeer, connect, rmhook, shutdown and name, and names its
          arguments in order.
      - name: wireguard
        doc: |
          Set up a WireGuard interface with wg(8).  verb init gives the
          interface a private key made on the host, when it has none,
          and with listen-port the port it listens on; peer adds or
          changes the peer whose public key is peer, with its endpoint,
          allowed-ips and keepalive; unpeer removes it.  A private key
          never leaves the host.  With persist the interface, as it is
          then, is written for wg-quick(8) to bring up at boot.
      - name: bird
        doc: |
          Tell the BIRD routing daemon through birdc(8).  verb is one
          of enable, disable, restart and reload, with the protocol as
          the one name, or configure, which reads its configuration
          again.
      - name: if-vnet
        doc: |
          Give the host's interface to the running jail named by jail,
          which has a network of its own (vnet), or with remove take it
          back to the host.  The interface epair, without a number, is
          a new epair(4) made for it: its a end stays on the host, a
          member of the bridge parent names when one is named, its b
          end goes to the jail.  Here jail is where the interface goes, not
          whose network is worked on: the host does it, with
          ifconfig(8).  With persist, also as vnet.interface of the
          jail in jail.conf.
      - name: kmod
        doc: |
          Load a kernel module, or unload one: verb is load or unload,
          and names the one module, as kldload(8) finds it, without a
          path.  With persist, also into or out of rc.conf's kld_list,
          which is what is loaded when the host starts.  keep and
          forget put it in kld_list or take it out (foo or foo.ko,
          however it is spelt there) without loading or unloading it.
      - name: zfs
        doc: |
          zfs(8).  verb and names: snapshot and dataset@name; destroy
          and a snapshot or a dataset, never a pool's own; rollback and
          a snapshot; create and a dataset, then properties as
          name=value, volsize=size making it a volume; set and a
          dataset, then properties; inherit, a dataset and a property;
          mount, unmount or promote and a dataset; clone, a snapshot
          and the new dataset; rename and the two names.  recursive is
          -r for snapshot, destroy and rollback, force -f for unmount.
      - name: zpool
        doc: |
          zpool(8).  verb and names: scrub, scrub-stop or trim and a
          pool; clear, a pool and with it a device; online or offline,
          a pool and a device; create, a pool and its devices, with
          mirror, raidz1, raidz2, raidz3, log, cache, spare or special
          before those put together so, and mountpoint=, altroot= and
          ashift=; add, a pool and devices in the same words; destroy
          or export and a pool, never one with a dataset mounted where
          the system lives (the root, /usr, /var, /home and the like),
          and never by force;
          import and a pool's name or number, with altroot=; attach, a
          pool, a device of it and the one to mirror it; detach or
          remove, a pool and a device; replace, a pool, a device and
          with it the new one.  force is -f.
      - name: mount
        doc: |
          verb mount and a mount point fstab(5) describes, or unmount
          and one that something is mounted on, never the root; force
          is umount -f.
      - name: gpart
        doc: |
          gpart(8).  verb and names: create, a disk and gpt, mbr or
          bsd; destroy and a disk whose table is empty; add, a disk, a
          type, and then a size and a label, either of which may be
          empty; delete, a disk and a partition's index; resize, a
          disk, an index and with it a size; modify, a disk, an index
          and a label.
      - name: cam
        doc: camcontrol(8).  verb rescan, of all buses.
      - name: sysctl
        doc: |
          Set a sysctl(8) variable: names holds its name and its value.
          With persist it is also written to sysctl.conf(5), where a
          line that set it before is replaced.
      - name: ipfw
        doc: |
          The firewall, ipfw(8).  The live rules Arcana changes are set
          0's, the set the kept rules are applied as; other sets are
          not touched.  verb add, with names a rule's number and then
          its words: with live it is added now, with persist it is
          written into the kept rules; the first rule kept when none
          is keeps the kernel's set 0 rules first, so that applying
          does not take them away.  verb delete, a number and the
          rule's words: that rule alone, the others of its number
          staying; with the number alone, its only rule, refused when
          it has several.  verb replace, the old number, the new and
          the new rule's words, with text the old rule's words: that
          rule replaced, the others of its number staying.  verb
          renumber, pairs of numbers, from and to: each number's rules
          given the other, now and kept, done in the order given,
          refused whole unless each to is free by the time it is
          reached.  Every change at a number is checked by ipfw -n
          first and done as one ipfw script; if the kernel refuses a
          line, the number's rules are put back as listed.  verb apply loads the kept rules as the
          host's whole ruleset without a gap: into set 1, which is
          disabled, then swapped with set 0; with safe the rules that
          were there wait in set 1 and are swapped back unless
          job-confirm comes.  verb enable or disable turns the
          firewall on or off (net.inet.ip.fw.enable), with persist in
          rc.conf.  verb zero clears the counters, of a rule when
          names has its number.  verb table, nat, nat64lsn, nat64stl,
          nat64clat, nptv6, pipe, queue or sched, with names what ipfw
          takes after that word (T46 add 10.0.0.1; 1 config if em0;
          1 delete), does it now, and with persist writes the same
          words as a line at the head of the kept rules.  jail is the
          vnet jail whose firewall it is: ipfw is run in the jail.
      - name: bridge
        doc: |
          if_bridge(4).  interface is the bridge, names the verb's
          words: addm or deletem and a member; access, a member and a
          VLAN it is in untagged, and none tagged; trunk, a member,
          the list of VLANs it carries tagged (none, all, or numbers
          and ranges) and, when there is one, the VLAN that is
          untagged on it; vlanfilter and on or off; flag, a member and
          one of stp, edge, autoedge, ptp, autoptp, learn, discover,
          sticky, private, span, qinq, with a - before it to take it
          away; set and one of proto, priority, hellotime, fwddelay,
          maxage, holdcnt, maxaddr, timeout, defuntagged with its
          value; ifset, a member, one of ifpriority, ifpathcost,
          ifmaxaddr, ifvlanproto and its value.  With persist it is
          kept in rc.conf.
      - name: geneve
        doc: |
          geneve(4).  interface is the tunnel.  verb create makes it,
          with names holding option and value pairs: mode (l2 or l3,
          which only a new one can be given), id, local, remote, group,
          dev, localport, remoteport, ttl (a number or inherit), df
          (set, unset or inherit), maxaddr, timeout.  verb set changes
          one or more of them on one that is there, and also learn,
          external and dscpinherit, each on or off, and portrange with
          its two ports.  verb flush empties its forwarding table, all
          of it with names all.  With persist it is kept in rc.conf.
      - name: process
        doc: |
          One process of the host.  verb signal, with names its number
          and the signal's name (TERM, KILL, HUP, ...) or number; verb
          renice, with names its number and the nice value, -20 to 20.
          A third of names is when the process started, in seconds
          since the epoch, as processes says it: when the process with
          that number started at another time it is another one, and
          is left alone.  With jail, only a process of that jail.
          Not init, not the kernel's own, and not the agent.
      - name: pkg-clean
        doc: |
          pkg clean -y on the host or in a running jail: the cached
          packages that are no longer needed, or that the repository no
          longer has, deleted; with force, all of the cache (-a).
      - name: ipsec
        doc: |
          IPsec through strongSwan's swanctl(8), IKEv2 only.  verb init
          gives the host a key of its own, ECDSA P-256 made on the
          host, whose public half the ipsec network kind tells; start
          starts the daemon (service strongswan onestart); conn
          writes the connection named conn, between tunnel-local and
          tunnel-remote, this host known by its key or by local-cert,
          the peer by pubkey (its key), remote-cert (its certificate)
          or remote-ca (a CA that signed it, remote-id saying which),
          its children kept, and with ipsec-mode one child of the
          connection's name, tunnel or transport between local-ts and
          remote-ts, with reqid the ipsec(4) interface of that reqid;
          child adds or changes the child named child the same way,
          unchild takes it away; unconn takes the connection away; up
          and down start and stop its security associations.  What is
          written is in conf.d, a file of its own that the daemon reads
          again and is there after a boot, beside a .json arcana keeps
          of it.
      - name: pkg-install
        doc: |
          pkg install -y of the packages names, on the host or in a
          running jail; with force, also of packages built for a newer
          FreeBSD (IGNORE_OSVERSION).
      - name: ntp
        doc: |
          The NTP servers the host keeps time by (Mplify 119 §12.2.2):
          names the servers, written into ntp.conf between arcana's
          marks, the lines there before taken out; with persist, ntpd
          enabled in rc.conf; ntpd restarted.  With remove, the marks
          and what is between them taken out and ntpd restarted.
      - name: rtadvd
        doc: |
          Router advertisements on an interface, for the hosts behind
          it to address themselves (SLAAC, MEF 70.2 §11.5): interface,
          and names, the prefix (a /64) and then the DNS servers to
          advertise (RDNSS), at most 8; an entry written into
          rtadvd.conf between arcana's marks, the interface's old one
          taken out; with persist, rtadvd enabled and the interface on
          rtadvd_interfaces in rc.conf; rtadvd restarted.  With remove,
          the interface's entry taken out, and rtadvd stopped when the
          block is empty.
      - name: ipsec-sa
        doc: |
          Manually keyed security associations for an ipsec(4)
          interface (Mplify 119 §10, R41-R50, R55): verb key, set,
          derive or clear, interface, reqid, the outer addresses
          tunnel-local and tunnel-remote, and as names the words
          spi-in n, spi-out n,
          enc aes-cbc|aes-gcm-16, auth hmac-sha1|hmac-sha2-256|
          hmac-sha2-512 (not with gcm), key-in hex, key-out hex,
          akey-in hex, akey-out hex, and the flags encap (ESP in UDP,
          port 4500) and esn.  Written as a file for setkey(8), ESP in
          tunnel mode with the reqid, and taken out again; the keys
          are not in the trace.  clear deletes every SA between the
          two addresses.  key makes the interface its X25519 pair,
          kept 0600, the public half in the sdwan read; derive takes
          peer, the far public half, and epoch n, and computes both
          directions from the agreement by HKDF-SHA256, the same on
          both ends (R51-R54); lifetime s is kept with the SAs.  A
          rotation (R110, R112): key with the word next makes the
          pair to come (its public half next in the read); derive
          with next and install in, then install out, puts the new
          SAs in beside the old, inbound first on both ends, the old
          outbound one out as the new goes in; commit takes the old
          inbound out and makes the next pair the pair.  A
          rotation that fails is a fault, key-rotation, until one is
          done.
      - name: jail-conf
        doc: |
          A jail made from the console, the way one is kept by hand: a
          file of its own, /etc/jail.conf.d/<jail>.conf, beginning
          with .include "/etc/jail.conf"; and holding its block and
          the .includes of its templates.  verb make writes it, text
          its whole content, read back by jail(8) -e before it is put
          in place (it defines the jail named and no other); with
          snapshot and dataset, the jail's dataset is made first from
          the base jail's snapshot, by zfs clone (copy clone) or zfs
          send | zfs recv (copy send, a copy of its own), mounted at
          path; with start, the jail is started.  What fails undoes
          what was done.  edit writes a made jail's file anew, text
          its whole content, read back the same way first, the file
          before kept beside it; a running jail keeps its path and takes
          the rest when restarted.  remove stops the jail, takes its file away,
          and with dataset destroys that dataset when it is mounted at
          the jail's path.  defaults writes text as /etc/jail.conf,
          the defaults every jail file includes, the file before kept
          beside it.  template writes text as /etc/jail.conf.d/<name>
          .inc, names its one name; untemplate takes one away that no
          jail includes.
      - name: neighbour
        doc: |
          A neighbour set by hand, ARP's or NDP's, with arp(8) or ndp(8)
          (-s, -d): verb add or delete, address, and for add lladdr,
          its link address; with temporary it ages out as the others
          do, without it it stays (permanent).  With persist it is
          kept for a boot as a pair of rc.conf's static_arp_pairs or
          static_ndp_pairs, and with live too it is set now.  In the
          jail whose network it is when jail names one.
      - name: cert
        doc: |
          A certificate OpenSSL trusts, with certctl(8): verb add puts the
          PEM certificate text in ${LOCALBASE}/share/certs/trusted as
          path, remove takes one of those away, untrust puts a copy of
          path of /etc/ssl/certs in ${LOCALBASE}/share/certs/untrusted,
          trust takes the copies of path of /etc/ssl/untrusted away from
          there; each then certctl rehash, which rehash alone is.
      - name: ssh
        doc: |
          The base system's sshd(8): verb banner writes text as
          /etc/ssh/banner and names it Banner (no text: Banner none);
          set puts the setting path with names as its values (none: the
          line taken away), of AllowUsers, AllowGroups, DenyUsers,
          DenyGroups, PermitRootLogin, PasswordAuthentication,
          KbdInteractiveAuthentication, PubkeyAuthentication,
          X11Forwarding, MaxAuthTries and Port; sign signs each host key
          with the CA private key in text (names its principals) for 52
          weeks and names each certificate HostCertificate; user-cas
          writes the CA public keys in text, one a line, as
          /etc/ssh/trusted_user_ca_keys and names it TrustedUserCAKeys
          (no text: the line taken away), so that users sign in with
          certificates those CAs signed.  Each is read
          by sshd -t first, the file before kept beside it
          (sshd_config.arcana-before) and put back in safe mode, and sshd
          reloaded.  authorize adds the key line text to user's
          authorized_keys, unauthorize takes away the key whose
          fingerprint text is, options sets the options of user's key
          whose fingerprint names says to text (as sshd(8) reads them:
          principals="...", from="...", restrict and the rest; empty for
          none), the key itself left as it is.  In jail's when jail
          names one.
      - name: carp
        doc: |
          An address that hosts on one network share with carp(4), held
          by the one that is MASTER of its virtual host: verb add makes
          the vhid on interface (or changes it) through carp's netlink
          family and puts address under it with ifconfig; set changes
          the vhid; remove takes address off, the vhid going with its
          last.  args are word=value: vhid (1-255), advbase, advskew,
          version (2 CARP, 3 VRRPv3, when it is made), prio and
          interval (VRRPv3), state (master or backup, set now only);
          preshared_key is the vhid's key, never on a command line.
          With persist the address is kept as an ifconfig_<if>_alias
          line with the vhid's words, its key too, and carp in kld_list.
          Only add is taken back in safe mode.  In jail's network when
          jail names one.
      - name: poudriere
        doc: |
          poudriere(8), the host's package builder, a plugin: verb and
          words key=value (names).  jail-create (name, version, arch,
          method), jail-update and ports-update (name), ports-create
          (name, method, branch, url, path) and bulk (jail, ports, set,
          jobs, clean=yes for -C, test=yes for -t, an origin= for each
          port, net/bird3) start a run and end: poudriere goes on by
          itself, its output in the run's log, the builder operation
          telling how it is.  stop (run) sends a run's process group
          SIGINT, as a terminal would.  jail-delete and ports-delete
          (name) run to their end, -y.  make-conf (name: none for
          make.conf, a jail's, a ports tree's, a set's or those joined
          by -) writes poudriere.d/<name>-make.conf from text, or takes
          it away when text is empty: WITH_DEBUG_PORTS+= net/bird3 in a
          set's builds it unstripped, with debug symbols.  conf sets
          poudriere.conf's variables by sysrc -f, an empty value
          unsetting one.  options (jail, ports, set, origin, an on= or
          off= for each option, or reset=yes) writes the port's options
          file as make config writes it, in the options directory a
          build of that jail, tree and set copies (the first there is
          of jail-tree-set, jail-set, jail-tree, tree-set, set, tree,
          jail and options, as poudriere bulk looks; jail-tree-set's,
          made, when none is), each option checked against the port's
          COMPLETE_OPTIONS_LIST; reset takes the file away, the port's
          defaults again.  The host's only; never in safe mode.
      - name: clamav
        doc: |
          ClamAV's freshclam, which fetches the signatures: verb and
          words key=value (names).  mirrors writes freshclam.conf's
          DatabaseMirror lines, each mirror= in the order given, in
          place of those there were; a freshclam.conf not there yet is
          made from the port's sample, its Example line taken out.  A
          running freshclam takes them when it is restarted.  The
          host's only; never in safe mode.
      - name: suricata
        doc: |
          Suricata's ruleset: verb update runs suricata-update, which
          fetches it (Emerging Threats Open unless told of other
          sources) to /var/lib/suricata/rules/suricata.rules; then the
          instances are applied again from what the agent kept of them,
          so that one started without it takes it, and those reading it
          already read their rules again.  Verb rule sets rules by sid
          (names on=, off=, drop= or default=, each sids joined by
          commas): kept by the agent and given to suricata-update as its
          enable.conf, disable.conf and drop.conf, so that they hold
          across updates; the ruleset is made again from what was
          fetched (--offline) and applied as by update.  Verb sources
          fetches suricata-update's index of sources (update-sources);
          verbs source-enable (name=, and its parameters, a commercial
          one's secret-code=, which the agent writes to the source's
          file itself, root's alone), source-disable, source-remove and
          source-add (name=, url=) each set one.  Verb pcap (instance=,
          file=) runs a capture the host has through an instance's
          configuration, offline (suricata -r), its alerts kept for the
          sdwan read.  The host's only; never in safe mode.
      - name: nfs
        doc: |
          The NFS server, NFSv4 alone (nfsd(8) with nfsv4_server_only,
          mountd(8) for the exports; no NFSv3, no rpcbind): verb exports
          writes exports(5) from text and has mountd read it again,
          refused unless its V4: root is a directory on ZFS (any text
          that exports needs the V4: line); verb share sets a dataset's
          sharenfs (zfsprops(7)) by names dataset= and sharenfs= (on,
          off or exports(5) options), zfs writing /etc/zfs/exports and
          telling mountd; verb server sets, by names, enable= (yes or
          no: nfsd, NFSv4 alone, with mountd, enabled and started, or
          stopped), minor= (NFSv4's 0, 1 or 2:
          vfs.nfsd.server_max_minorversion, kept in sysctl.conf),
          threads= and pNFS's data servers pnfs= (host:/path joined by
          commas) and mirror= (nfsd's -n, -p and -m, pnfsserver(4)).
          The host's only; never in safe mode.
      - name: iscsi
        doc: |
          The iSCSI target (ctld(8)): verb conf writes ctl.conf(5) from
          text (root's alone: it may hold CHAP secrets) and has ctld read
          it again; verb enable, enable=yes or no, enables and starts it
          or stops it.  The host's only; never in safe mode.
      - name: hast
        doc: |
          HAST (hastd(8)): verb conf writes hast.conf(5) from text and
          has hastd read it again; verb enable, enable=yes or no; verb
          create, resource=, makes a resource's metadata (hastctl
          create); verb role, resource= and role= (init, primary or
          secondary), sets its role.  The host's only; never in safe
          mode.
      - name: sysfile
        doc: |
          A file of the system's, one of a fixed table, written whole
          from text, and the daemon that reads it told: the verb names
          it, devfs.rules, devd (/usr/local/etc/devd/arcana.conf),
          syslog.conf, newsyslog.conf, periodic.conf, audit_control,
          audit_user, krb5.conf, ipsec.conf (setkey's), rctl.conf or
          loader.conf.d (/boot/loader.conf.d/arcana.conf).  Verb periodic
          sets periodic.conf's variables by names, name_enable=YES or
          NO; verb rc rc.conf's kern_securelevel_enable= and
          kern_securelevel= (-1 to 3), securelevel at boot.  Verb dma
          sets dma(8)'s smart host: args smarthost= (empty: delivered
          straight), port=, tls= (none, starttls, opportunistic or tls)
          and user=, the password the text (one line; none keeps the one
          there).  dma.conf's SMARTHOST, PORT, SECURETRANSFER, STARTTLS,
          OPPORTUNISTIC_TLS and AUTHPATH alone are written, its other
          lines kept; the sign-in is that host's line of auth.conf, mode
          0640, group mail.  The host's only.
      - name: geom
        doc: |
          A GEOM class at work, geom(8): the verb the class (mirror,
          stripe, concat, raid3, label, nop, multipath, shsec, virstor,
          cache, journal, eli or union), the first name its subcommand,
          one of the class's own, or load, unload, list or status; the
          rest its words,
          flags and names alone.  A GELI passphrase is text, given by a
          file of the job's own (-J, -j).  The host's only; never in safe
          mode.
      - name: smtpd
        doc: |
          OpenSMTPD (mail/opensmtpd, a plugin the host has installed):
          verb conf renders smtpd.conf from the form given as text
          (JSON: listeners, domains, delivery, relay, policy, filters
          and own lines), checks it with smtpd -n and restarts smtpd
          where it runs, the form kept beside the file; verb table, a
          name (aliases, virtuals, domains, senders, credentials,
          secrets) and its text, writes the table's file (credentials'
          passwords hashed by OpenSMTPD's encrypt, the clear ones kept
          nowhere; credentials and secrets root's alone) and has smtpd
          read it again; verb enable, enable=yes or no; verbs pause and
          resume with mta, mda or smtp; schedule and remove with an
          envelope's or message's id or all; update with a table's
          name: smtpctl's own; entry, with names a table's name and
          text lines, puts each line in the table by its key (its
          first word), replacing the lines of that key and keeping the
          others; unentry, names a table's name and a key, takes that
          key's lines out.  The host's, or with jail a jail's (its
          own files and programs, a network of its own or not); never in
          safe mode.
      - name: jail-allow
        doc: |
          A jail's allow.* parameters set on the running jail (live)
          and in its file (persist): jail and names, each
          allow.name=0|1|unset.
      - name: jail-base
        doc: |
          A running jail's base system by pkg(8), as pkgbase.  Verb
          convert installs the base system packages over the jail's
          files from the official base repository of its own release
          (names the sets to install, FreeBSD-set-base-jail when
          none; release, the repository's branch instead of the
          jail's own); verb upgrade takes a jail already on pkgbase to
          release, "16" (the latest of that major) or "15.2", its base
          packages and then its other packages for the new ABI, never
          beyond the host's kernel.  The official repository is
          written in the jail under arcana's own name, arcana-base,
          so that a repository of the admin's is not merged into it;
          with pkg-repo, one of the jail's own repositories is used
          instead, as it is.  Both keep the jail's /etc aside in
          /var/backups first and put back the jail's own files that pkg
          put aside as .pkgsave (master.passwd and group merged with the
          new base's accounts, pwd_mkdb run in the jail), naming the
          packages' versions left as .pkgnew to merge; the jail is to be
          restarted after.  With force, past OSVERSION for
          the other packages (IGNORE_OSVERSION); pkg-ip as pkg -4 or
          -6.  Needs FreeBSD 15.1 or later in the jail.
      - name: reboot
        doc: |
          The host itself rebooted, by shutdown(8) -r a minute from
          now, so that the job's answer reaches whoever asked before
          the host goes; it is not undone, so never in safe mode, and
          a jail is restarted (jail-action), not rebooted.
      - name: speeder
        doc: |
          UDPspeeder's FEC relay, a plugin (speederv2), run by Arcana's
          own rc service, arcana_relay: conf (args: role=client|server,
          listen=, remote=, mode=, mtu=, fec=, timeout=, report=, fifo=,
          key=, nokey, extra=, written to arcana_relay_flags, restarted
          when it runs), fec (args: the ratios, sent to the running
          relay by its fifo and kept in the flags), enable, disable,
          start, stop, restart; with profile=<name> one of several
          relays, its words in arcana_relay_<name>_flags, its name in
          arcana_relay_profiles, and remove takes one away.  Of the
          host, or with jail of that jail.  Undone in safe mode on the
          host: the rc.conf variables and whether it ran.
      - name: monitor
        doc: |
          A tunnel measured outside SD-WAN: set (args: name=, and
          interface=, address= (on the host, a point-to-point
          interface's far end when not given), fib= (the interface's
          when not given), interval=, size=, dscp=, eval=, history=,
          down=, up=, timeout=, delay-max= and ipdv-max= (ms),
          loss-max= (per cent), damping=) or remove (args: name=).
          Probed by ICMP echo from the host, or with jail from that
          vnet jail's network; kept in monitors.json beside
          history.conf for the next start; never touched by SD-WAN.
  - name: job-state
    type: enum
    entries:
      - queued
      - running
      - name: done
        doc: Finished; ok says how.
      - name: cancelled
        doc: Removed from the queue before it ran.
      - name: unconfirmed
        doc: |
          The change is made and waits for job-confirm; without it in
          time, it is undone.
  - name: max-json
    type: const
    value: 4194304
  - name: net-kind
    type: enum
    entries:
      - name: routes
        doc: The routing table, netstat -rnW.
      - name: nexthops
        doc: The nexthop table, netstat -onW.
      - name: connections
        doc: Active connections, netstat -n.
      - name: sockets
        doc: Open sockets with their owners, sockstat.
      - name: interfaces
        doc: |
          The network interfaces with their addresses, flags, link and
          counters, from getifaddrs(3), as a JSON object with the array
          "interfaces" and "time", the milliseconds of a clock that only
          runs forward, to make rates of the counters.
      - name: netgraph
        doc: |
          Retired: arcana-netgraph's netgraph, its read action a
          jail's.  Refused; its number kept.
      - name: wireguard
        doc: |
          Retired: arcana-wireguard's wireguard, its read action a
          jail's.  Refused; its number kept.
      - name: bird
        doc: |
          Retired: arcana-bird's bird, its state (the operational
          datastore's) and its read action a jail's.  Refused; its
          number kept.
      - name: bird-routes
        doc: |
          Retired: arcana-bird's routes action.  Refused; its number
          kept.
      - name: bridges
        doc: |
          The bridges, if_bridge(4), as a JSON object with the array
          "bridges": each with its spanning tree (protocol, its own
          identifier and the root's, the root port and cost, the
          timers), whether it filters VLANs, and its "members", each
          with its flags, port number, priority and path cost, its
          role and state in the spanning tree, the VLAN it is in
          untagged and those it carries tagged, and the addresses it
          has, which a member should not have; and "learned", the
          addresses the bridge has learned, each with its mac, vlan,
          the member it is behind and when it expires, the first 500
          of learned_total.
      - name: geneve
        doc: |
          The geneve(4) tunnels, as a JSON object with the array
          "geneves": each with its mode, identifier, local and remote
          or group address and ports, device, ttl, df, and its
          forwarding table's settings.
      - name: ipfw
        doc: |
          The firewall, ipfw(8), as a JSON object: "loaded" and
          "enabled"; "rules", each with its number, set, counters and
          text, and whether its set is disabled; "tables", each with
          its name, type, count and the first of its entries (key,
          value); "nat" and "pipes", as ipfw shows them; "qos", the
          pipes, schedulers and queues of dummynet as objects: "pipes"
          (num, bw in bits a second, 0 for none, delay ms, burst,
          slots or bytes, plr, mask), "scheds" (num, bw, delay, type,
          mask, queues, the queues that feed it, and params) and
          "queues" (num, sched, weight, pri, slots or bytes, plr, mask,
          red), a mask with src and dst, prefix lengths, the ports and
          proto; "verbose";
          "kept", the rules of the kept file each with its number and
          text, "other" its lines that are not rules, "path" where it
          is and "rc" what rc.conf says of the firewall.
      - name: nhgroups
        doc: |
          The kernel's nexthop groups, what a route of several next
          hops (ECMP) points to, as netstat -O prints them: each with
          its index, how many routes use it, and its next hops with
          the share of each.
      - name: neighbours
        doc: |
          The neighbours, ARP's and NDP's, asked of the kernel through
          netlink(4): a JSON object with the array "neighbours", each
          with its family, address, link-level address, interface,
          state (reachable, stale, delay, probe, incomplete, permanent)
          and when it moves on ("next", seconds of the kernel's uptime),
          with "router" for a router; and "total", how many there are
          before the filter.
      - name: ipsec
        doc: |
          strongSwan's IPsec, from swanctl(8): a JSON object with
          "running", whether its daemon answers; "public-key", the
          host's own, of verb init, in base64; "connections", each with
          its name, version, addresses, identities, whether arcana
          wrote it ("arcana") and its children with their mode, reqid
          and traffic selectors; and "sas", the security associations,
          IKE and their children, with state, algorithms and counters.
          Never a private key.
      - name: multicast
        doc: |
          IGMP's and MLD's state, from ifmcstat(8): a JSON object with
          "interfaces", each with its name, "igmp" and "mld" (the version
          the interface speaks, its robustness, query and query response
          intervals, unsolicited report interval, and MLD's flags) and
          "groups", the groups joined there, each with its family,
          address, filter mode, link-level address and sources; and
          "settings", the kernel's (net.inet.igmp.* and net.inet6.mld.*,
          name and value), which a job of kind sysctl sets.
      - name: bird-ospf
        doc: |
          Retired: arcana-bird's ospf action.  Refused; its number
          kept.
      - name: kept-routes
        doc: |
          The static routes rc.conf keeps, from sysrc(8), of the host
          or the jail: a JSON object with "routes", each with its
          "name", "family", "list" (static_routes or
          ipv6_static_routes), "variable", "value" as route(8) is given
          it, and read from it "destination", "gateway", "kind"
          (gateway, interface, blackhole or reject) and "fib";
          "listed" false for a variable the list does not name (rc(8)
          leaves it), "missing" true for a name without its variable;
          and "defaults", the default routers, each with its
          "variable", "family", "fib" and "gateway".
  - name: storage-kind
    type: enum
    entries:
      - name: disks
        doc: |
          The disks and the partitions of each, from GEOM, with what
          camcontrol(8) says each disk is.
      - name: pools
        doc: The ZFS pools with their devices, from zpool(8).
      - name: datasets
        doc: The ZFS file systems and volumes, from zfs(8).
      - name: snapshots
        doc: |
          The ZFS snapshots, the newest first; of the dataset
          net-filter names and those under it, or of all.
      - name: mounts
        doc: What is mounted, and what fstab(5) says to mount.
      - name: importable
        doc: |
          The pools zpool(8) finds on the host's devices that are not
          imported.
      - name: health
        doc: |
          How the disks are, as they say themselves, as a JSON object
          with "disks": each with its name; "by", the program that
          asked it (nvmecontrol for an NVMe disk, smartctl of
          smartmontools for another, when the host has it); "ok",
          whether it says it is well; its temperature in Celsius,
          power_on_hours, power_cycles; for an NVMe disk used_pct and
          spare_pct, media_errors and unsafe_shutdowns; for another
          the raw values of reallocated, pending, uncorrectable,
          crc_errors and what it has of wear_level, life_left and
          media_wearout; and "note", why it was not asked.
  - name: net-family
    type: enum
    entries:
      - name: all
      - name: inet
      - name: inet6
  - name: max-output
    type: const
    value: 262144
  - name: action
    type: enum
    entries:
      - start
      - stop
      - restart
      - name: kill
        doc: Remove the jail with jail_remove(2), without its stop scripts.
      - name: enable
        doc: |
          Started at boot from now: rc.conf's jail_list names it, and
          jail_enable is yes.  With jail_enable off before, the list is
          the jail alone, not every jail rc.d/jail would start with an
          empty one; with an empty list and jail_enable on, every jail
          starts already and nothing is written.
      - name: disable
        doc: |
          Not started at boot: taken out of jail_list.  An empty list
  - name: jail-state
    type: enum
    entries:
      - running
      - stopped
      - dying
      - absent
  - name: service-action
    type: enum
    entries:
      - start
      - stop
      - restart
      - reload
      - name: enable
        doc: sysrc(8) sets the service's rcvar to YES.
      - name: disable
        doc: sysrc(8) sets the service's rcvar to NO.
attribute-sets:
  - name: jail
    doc: |
      A jail, as the agent's jail.c reads it; arcana-jails has it now:
      kept a structure for the agent's own use.
    structure: true
    attributes:
      - name: name
        type: text
      - name: state
        type: u8
        enum: jail-state
      - name: jid
        type: u32
      - name: configured
        type: bool
      - name: scope
        type: text
        doc: The configuration file that defines the jail.
      - name: hostname
        type: text
      - name: path
        type: text
      - name: ip4
        type: text
        multi-attr: true
      - name: ip6
        type: text
        multi-attr: true
      - name: vnet
        type: bool
      - name: osrelease
        type: text
      - name: persist
        type: bool
      - name: securelevel
        type: s32
      - name: parent
        type: u32
      - name: children
        type: u32
      - name: nproc
        type: u32
      - name: rss-kb
        type: u64
      - name: cpu-pct
        type: float
      - name: interface
        type: text
      - name: params
        type: nest
        nested-attributes: param
        multi-attr: true
        doc: Configured parameters as jail(8) resolves them.
      - name: plugins
        type: text
        multi-attr: true
        doc: |
          Of a running jail with a network of its own: the plugins it
          has, as a host's, by the programs installed in the jail.
      - name: allow
        type: text
        multi-attr: true
        doc: |
          Of a running jail: its allow.* parameters as the kernel has
          them, each "allow.name=0|1" (jail-allow sets them).
      - name: boot
        type: bool
        doc: |
          Of a jail defined: started at boot by rc.d/jail, jail_enable
          being yes and jail_list empty or naming it.

  - name: param
    attributes:
      - name: key
        type: text
      - name: values
        type: text
        multi-attr: true

  - name: service
    doc: |
      An rc.d script, as the agent's services.c reads it; arcana-services
      has it now: kept a structure for the agent's own use.
    structure: true
    attributes:
      - name: name
        type: text
      - name: path
        type: text
        doc: The script, in /etc/rc.d or /usr/local/etc/rc.d.
      - name: rcvar
        type: text
        doc: The rc.conf variable that enables it, if it has one.
      - name: enabled
        type: bool
      - name: running
        type: bool
        doc: What "service <name> status" says; absent when not asked.
      - name: pid
        type: u32
      - name: status
        type: text
        doc: The status line, as the script printed it.

  - name: variable
    attributes:
      - name: key
        type: text
      - name: value
        type: text
      - name: remove
        type: flag
        doc: In a request, unset the variable instead (sysrc -x).

  - name: job-spec
    doc: |
      One change to queue; the attributes its kind needs.  arcana-jobs'
      submit carries it now, a change made one by the agent: kept a
      structure for the agent's queue.
    structure: true
    attributes:
      - name: kind
        type: u8
        enum: job-kind
      - name: jail
        type: text
        checks:
          max-len: 255
      - name: action
        type: u8
        enum: action
      - name: address
        type: text
        checks:
          max-len: 64
      - name: interface
        type: text
        checks:
          max-len: 15
      - name: remove
        type: flag
      - name: live
        type: flag
      - name: persist
        type: flag
      - name: service
        type: text
        checks:
          max-len: 64
      - name: service-action
        type: u8
        enum: service-action
      - name: variables
        type: nest
        nested-attributes: variable
        multi-attr: true
      - name: names
        type: text
        multi-attr: true
      - name: up
        type: bool
        doc: For if-state.
      - name: safe
        type: flag
        doc: |
          Undo the change unless job-confirm comes for the job within
          the time the daemon allows.  A client that can still reach the
          daemon after the change confirms; one the change cut off
          cannot, and the host comes back by itself.  For the changes
          that can be taken back: if-address, if-state, if-set,
          if-create, route, address, service-config, and a service's
          start, stop, enable and disable.
      - name: destination
        type: text
        doc: |
          For route, as default, a network with its prefix length, or a
          host address.
        checks:
          max-len: 64
      - name: gateway
        type: text
        doc: |
          For route, an address, or the name of an interface; or
          several addresses with a comma between, each with its share
          after an @ when it has one (10.0.0.1@2,10.0.0.2), for a
          route with as many next hops.
        checks:
          max-len: 512
      - name: fib
        type: u32
        doc: |
          For route, the routing table; 0 when not given.  For if-set
          and if-create, the interface's: what is received on it is
          looked up there.
      - name: mtu
        type: u32
        doc: For if-set and if-create.
      - name: description
        type: text
        doc: For if-set and if-create.
        checks:
          max-len: 64
      - name: tunnel-local
        type: text
        doc: For if-create, a tunnel's outer address on this host.
        checks:
          max-len: 64
      - name: tunnel-remote
        type: text
        doc: For if-create, a tunnel's outer address at the far end.
        checks:
          max-len: 64
      - name: id
        type: u32
        doc: For if-create, a VLAN tag or a VXLAN identifier.
      - name: parent
        type: text
        doc: For if-create, the interface a VLAN rides or a bridge takes in.
        checks:
          max-len: 15
      - name: verb
        type: text
        doc: For netgraph, wireguard, bird, poudriere, clamav and suricata, what to do.
        checks:
          max-len: 16
      - name: peer
        type: text
        doc: For wireguard, a peer's public key.
        checks:
          max-len: 44
      - name: endpoint
        type: text
        doc: For wireguard, where a peer is reached, as address and port.
        checks:
          max-len: 128
      - name: allowed-ips
        type: text
        doc: For wireguard, the networks a peer may send from, with commas.
        checks:
          max-len: 1024
      - name: keepalive
        type: u32
        doc: For wireguard, seconds between keepalives to a peer; 0 for none.
      - name: listen-port
        type: u32
        doc: For wireguard, the port the interface listens on.
      - name: recursive
        type: flag
        doc: For zfs, with those under it (-r).
      - name: force
        type: flag
        doc: For unmounting, though it is in use (-f).
      - name: metric
        type: u32
        doc: |
          For route, the cost of the route: of several to one
          destination the lowest is used (route -metric).
      - name: weight
        type: u32
        doc: |
          For route, its share among routes of the same metric to one
          destination (route -weight).
      - name: source
        type: text
        doc: |
          For route, the address of this host that what takes the route
          is sent from (route -ifa).
        checks:
          max-len: 64
      - name: pkg-ip
        type: u8
        doc: |
          For pkg-upgrade, the repository reached over IPv4 only (4,
          pkg -4) or IPv6 only (6, pkg -6).
        checks:
          max: 6
      - name: conn
        type: text
        doc: |
          For ipsec, the connection: letters, digits, - and _, kept in
          conf.d/arcana-<conn>.conf.
        checks:
          max-len: 32
      - name: ipsec-mode
        type: text
        doc: For ipsec conn, tunnel or transport.
        checks:
          max-len: 9
      - name: local-ts
        type: text
        doc: |
          For ipsec conn, this side's traffic selectors with commas, as
          swanctl.conf(5) writes them (2001:db8::1[gre]); none says the
          address itself in transport mode, everything in tunnel mode.
        checks:
          max-len: 512
      - name: remote-ts
        type: text
        doc: For ipsec conn, the peer's traffic selectors, as local-ts.
        checks:
          max-len: 512
      - name: pubkey
        type: text
        doc: |
          For ipsec conn, the peer's public key in base64 (DER), as the
          ipsec network kind tells it of that host.
        checks:
          max-len: 1024
      - name: reqid
        type: u32
        doc: |
          For ipsec conn, the reqid of the ipsec(4) interface it serves:
          tunnel mode, its policies the interface's.  For if-create of an
          ipsec interface, the reqid it is made with.
      - name: start-action
        type: text
        doc: |
          For ipsec conn: start, up at once and kept up; trap, up with
          the first packet that needs it (the default); none, only by
          up.
        checks:
          max-len: 5
      - name: local-id
        type: text
        doc: |
          For ipsec conn, this side's identity when it is not its
          address (behind NAT, the address it has there).
        checks:
          max-len: 128
      - name: remote-id
        type: text
        doc: For ipsec conn, the peer's identity, as local-id.
        checks:
          max-len: 128
      - name: tunnelfib
        type: u32
        doc: |
          For if-set and if-create of a tunnel (gif, gre, vxlan, geneve,
          wg), the routing table its outer packets are sent by.
      - name: child
        type: text
        doc: |
          For ipsec child and unchild, the child's name under the
          connection conn: its mode, traffic, reqid and start are the
          child's.
        checks:
          max-len: 32
      - name: local-cert
        type: text
        doc: |
          For ipsec conn, this host's certificate, a file in swanctl's
          x509 (its key in private or pkcs8), in place of the key
          arcana made it.
        checks:
          max-len: 128
      - name: remote-cert
        type: text
        doc: |
          For ipsec conn, the peer's certificate, a file in swanctl's
          x509, in place of its public key.
        checks:
          max-len: 128
      - name: remote-ca
        type: text
        doc: |
          For ipsec conn, a CA in swanctl's x509ca that signed the
          peer's certificate, which remote-id names, in place of its
          public key.
        checks:
          max-len: 128
      - name: addressing
        type: text
        doc: |
          For if-set, how the interface gets its address: dhcp
          (dhclient, by rc.conf's DHCP word, so with persist), slaac
          (inet6 accept_rtadv and rtsol, kept in ifconfig_<if>_ipv6),
          static, which takes both off, or was: as it was before
          Arcana first set dhcp or slaac on it (rc.conf's two lines,
          DHCP and SLAAC, kept by the agent then), nothing when that
          was not kept (Mplify 119 §12.2.3.2, §12.2.3.3).  A safe
          change undone puts back what the interface had before it.
        checks:
          max-len: 8
      - name: safe-wait
        type: u32
        doc: |
          With safe: the seconds the change waits to be confirmed
          before it is undone, in place of the agent's own (-w); the
          console's rollback timer for the host.
        checks:
          min: 10
          max: 3600
      - name: dataset
        type: text
        doc: For jail-conf, the jail's ZFS dataset.
        checks:
          max-len: 255
      - name: snapshot
        type: text
        doc: For jail-conf make, the base jail's snapshot it is made from.
        checks:
          max-len: 255
      - name: copy
        type: text
        doc: For jail-conf make, clone or send.
        checks:
          max-len: 8
      - name: path
        type: text
        doc: |
          For jail-conf, the jail's root, its dataset's mountpoint; for
          cert, the certificate's file name.
        checks:
          max-len: 1024
      - name: text
        type: text
        doc: |
          For jail-conf, a file's whole content; for cert add, the
          certificate as PEM.
        checks:
          max-len: 65536
      - name: start
        type: flag
        doc: For jail-conf make, the jail started once made.
      - name: preshared-key
        type: text
        doc: |
          For wireguard peer, the peer's preshared key, 44 characters of
          base64: given to wg(8) in a file of the agent's that is there
          only while it is read, and in no title nor trace.
        checks:
          max-len: 44
      - name: lladdr
        type: text
        doc: For neighbour add, the link address, six bytes of hex.
        checks:
          max-len: 17
      - name: temporary
        type: flag
        doc: For neighbour add, one that ages out as the others do.
      - name: user
        type: text
        doc: For ssh authorize, unauthorize and options, the user whose keys.
        checks:
          max-len: 32
      - name: pkg-repo
        type: text
        doc: |
          For pkg-upgrade and pkg-install, the repository only (pkg -r),
          one of those pkg is configured with there.
        checks:
          max-len: 64

      - name: release
        type: text
        doc: |
          A FreeBSD release to go to (jail-base upgrade: "16", the
          latest of that major, or "15.2"); for convert, the branch
          of the FreeBSD-base repository, the jail's own release when
          none.
        checks:
          max-len: 16
      - name: accept
        type: text
        multi-attr: true
        doc: |
          For service-action's enable and disable and service-config,
          written to Arcana's rc.conf file as a commit is: the warnings
          accepted (rc-conf-files, rc-conf-conflict), a commit's
          accept.
        checks:
          max-len: 32
  - name: job
    doc: |
      A job, as the agent's queue keeps it; arcana-jobs has it now:
      kept a structure for the queue.
    structure: true
    attributes:
      - name: id
        type: u64
      - name: kind
        type: u8
        enum: job-kind
      - name: title
        type: text
        doc: What it does, in words.
      - name: state
        type: u8
        enum: job-state
      - name: ok
        type: bool
        doc: With state done, whether it succeeded.
      - name: error
        type: text
      - name: created
        type: s64
        doc: Unix time it was queued.
      - name: started
        type: s64
      - name: finished
        type: s64
      - name: peer
        type: text
        doc: Who queued it.
      - name: confirm-by
        type: s64
        doc: With state unconfirmed, the Unix time it is undone at.
