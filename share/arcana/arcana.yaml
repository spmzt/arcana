# SPDX-License-Identifier: BSD-2-Clause
---
name: arcana
version: 1
c-prefix: arc
doc: |
  One FreeBSD host, as the Arcana agent serves it: its jails, services,
  packages, network tables and usage, and changes to them.
  Served by arcana-agent(8).  Every operation needs an authenticated peer.
  Replies report failures in ok/error and always carry a trace, so the
  output of a failed jail(8) run still reaches the client.

definitions:
  - name: max-jails
    type: const
    value: 4096
  - name: max-steps
    type: const
    value: 1024
  - name: max-services
    type: const
    value: 1024
  - name: max-packages
    type: const
    value: 16384
  - name: max-batch
    type: const
    value: 64
  - name: job-kind
    type: enum
    entries:
      - name: jail-action
        doc: jail and action, as the action operation.
      - name: address
        doc: As the address operation, without dry-run.
      - name: service-action
      - name: service-config
        doc: service and variables to set or unset.
      - name: pkg-upgrade
      - name: if-address
        doc: |
          With interface and address, add the address to the interface
          as an alias, or with remove take it off.  Live, with
          ifconfig(8); with persist, also in rc.conf, as the next
          ifconfig_<interface>_alias<n>, which stay without gaps.
      - name: if-state
        doc: With interface and up, bring the interface up or down.
      - name: route
        doc: |
          With destination and gateway, add a static route, or with
          remove delete it, in the routing table fib names.  Live, with
          route(8); with persist, also in rc.conf (static_routes).
      - name: if-set
        doc: |
          With interface, set its mtu, its description, or both; an
          empty description takes it off.  With persist, also in rc.conf.
      - name: if-create
        doc: |
          Create the cloned interface named by interface, a name with
          its unit (gif0) or a type alone (gif), of one of the types the
          daemon knows.  tunnel-local and tunnel-remote are a tunnel's
          outer ends, address and destination its inner ones, id a VLAN
          tag or a VXLAN identifier, parent the interface a VLAN rides
          or a bridge's first member.  What cannot be finished is
          destroyed again.  With persist, also in rc.conf.
      - name: if-destroy
        doc: Destroy a cloned interface; with persist, forget it in rc.conf.
      - name: netgraph
        doc: |
          Change the netgraph(4) graph with ngctl(8).  verb is one of
          mkpeer, connect, rmhook, shutdown and name, and names its
          arguments in order.
      - name: wireguard
        doc: |
          Set up a WireGuard interface with wg(8).  verb init gives the
          interface a private key made on the host, when it has none,
          and with listen-port the port it listens on; peer adds or
          changes the peer whose public key is peer, with its endpoint,
          allowed-ips and keepalive; unpeer removes it.  A private key
          never leaves the host.  With persist the interface, as it is
          then, is written for wg-quick(8) to bring up at boot.
      - name: bird
        doc: |
          Tell the BIRD routing daemon through birdc(8).  verb is one
          of enable, disable, restart and reload, with the protocol as
          the one name, or configure, which reads its configuration
          again.
      - name: if-vnet
        doc: |
          Give the host's interface to the running jail named by jail,
          which has a network of its own (vnet), or with remove take it
          back to the host.  The interface epair, without a number, is
          a new epair(4) made for it: its a end stays on the host, a
          member of the bridge parent names when one is named, its b
          end goes to the jail.  Here jail is where the interface goes, not
          whose network is worked on: the host does it, with
          ifconfig(8).  With persist, also as vnet.interface of the
          jail in jail.conf.
      - name: kmod
        doc: |
          Load a kernel module, or unload one: verb is load or unload,
          and names the one module, as kldload(8) finds it, without a
          path.  With persist, also into or out of rc.conf's kld_list,
          which is what is loaded when the host starts.
      - name: zfs
        doc: |
          zfs(8).  verb and names: snapshot and dataset@name; destroy
          and a snapshot or a dataset, never a pool's own; rollback and
          a snapshot; create and a dataset, then properties as
          name=value, volsize=size making it a volume; set and a
          dataset, then properties; inherit, a dataset and a property;
          mount, unmount or promote and a dataset; clone, a snapshot
          and the new dataset; rename and the two names.  recursive is
          -r for snapshot, destroy and rollback, force -f for unmount.
      - name: zpool
        doc: |
          zpool(8).  verb and names: scrub, scrub-stop or trim and a
          pool; clear, a pool and with it a device; online or offline,
          a pool and a device; create, a pool and its devices, with
          mirror, raidz1, raidz2, raidz3, log, cache, spare or special
          before those put together so, and mountpoint=, altroot= and
          ashift=; add, a pool and devices in the same words; destroy
          or export and a pool, never one with a dataset mounted where
          the system lives (the root, /usr, /var, /home and the like),
          and never by force;
          import and a pool's name or number, with altroot=; attach, a
          pool, a device of it and the one to mirror it; detach or
          remove, a pool and a device; replace, a pool, a device and
          with it the new one.  force is -f.
      - name: mount
        doc: |
          verb mount and a mount point fstab(5) describes, or unmount
          and one that something is mounted on, never the root; force
          is umount -f.
      - name: gpart
        doc: |
          gpart(8).  verb and names: create, a disk and gpt, mbr or
          bsd; destroy and a disk whose table is empty; add, a disk, a
          type, and then a size and a label, either of which may be
          empty; delete, a disk and a partition's index; resize, a
          disk, an index and with it a size; modify, a disk, an index
          and a label.
      - name: cam
        doc: camcontrol(8).  verb rescan, of all buses.
      - name: sysctl
        doc: |
          Set a sysctl(8) variable: names holds its name and its value.
          With persist it is also written to sysctl.conf(5), where a
          line that set it before is replaced.
      - name: ipfw
        doc: |
          The firewall, ipfw(8).  verb add, with names a rule's number
          and then its words: with live it is added now, with persist
          it is written into the kept rules.  verb delete and a number,
          the same two ways.  verb apply loads the kept rules as the
          host's whole ruleset without a gap: into set 1, which is
          disabled, then swapped with set 0; with safe the rules that
          were there wait in set 1 and are swapped back unless
          job-confirm comes.  verb enable or disable turns the
          firewall on or off (net.inet.ip.fw.enable), with persist in
          rc.conf.  verb zero clears the counters, of a rule when
          names has its number.  verb table, nat, nat64lsn, nat64stl,
          nat64clat, nptv6, pipe, queue or sched, with names what ipfw
          takes after that word (T46 add 10.0.0.1; 1 config if em0;
          1 delete), does it now, and with persist writes the same
          words as a line at the head of the kept rules.  jail is the
          vnet jail whose firewall it is: ipfw is run in the jail.
      - name: bridge
        doc: |
          if_bridge(4).  interface is the bridge, names the verb's
          words: addm or deletem and a member; access, a member and a
          VLAN it is in untagged, and none tagged; trunk, a member,
          the list of VLANs it carries tagged (none, all, or numbers
          and ranges) and, when there is one, the VLAN that is
          untagged on it; vlanfilter and on or off; flag, a member and
          one of stp, edge, autoedge, ptp, autoptp, learn, discover,
          sticky, private, span, qinq, with a - before it to take it
          away; set and one of proto, priority, hellotime, fwddelay,
          maxage, holdcnt, maxaddr, timeout, defuntagged with its
          value; ifset, a member, one of ifpriority, ifpathcost,
          ifmaxaddr, ifvlanproto and its value.  With persist it is
          kept in rc.conf.
      - name: geneve
        doc: |
          geneve(4).  interface is the tunnel.  verb create makes it,
          with names holding option and value pairs: mode (l2 or l3,
          which only a new one can be given), id, local, remote, group,
          dev, localport, remoteport, ttl (a number or inherit), df
          (set, unset or inherit), maxaddr, timeout.  verb set changes
          one or more of them on one that is there, and also learn,
          external and dscpinherit, each on or off, and portrange with
          its two ports.  verb flush empties its forwarding table, all
          of it with names all.  With persist it is kept in rc.conf.
      - name: process
        doc: |
          One process of the host.  verb signal, with names its number
          and the signal's name (TERM, KILL, HUP, ...) or number; verb
          renice, with names its number and the nice value, -20 to 20.
          A third of names is when the process started, in seconds
          since the epoch, as processes says it: when the process with
          that number started at another time it is another one, and
          is left alone.  With jail, only a process of that jail.
          Not init, not the kernel's own, and not the agent.
      - name: pkg-clean
        doc: |
          pkg clean -y on the host or in a running jail: the cached
          packages that are no longer needed, or that the repository no
          longer has, deleted; with force, all of the cache (-a).
      - name: ipsec
        doc: |
          IPsec through strongSwan's swanctl(8), IKEv2 only.  verb init
          gives the host a key of its own, ECDSA P-256 made on the
          host, whose public half the ipsec network kind tells; start
          starts the daemon (service strongswan onestart); conn
          writes the connection named conn, between tunnel-local and
          tunnel-remote, this host known by its key or by local-cert,
          the peer by pubkey (its key), remote-cert (its certificate)
          or remote-ca (a CA that signed it, remote-id saying which),
          its children kept, and with ipsec-mode one child of the
          connection's name, tunnel or transport between local-ts and
          remote-ts, with reqid the ipsec(4) interface of that reqid;
          child adds or changes the child named child the same way,
          unchild takes it away; unconn takes the connection away; up
          and down start and stop its security associations.  What is
          written is in conf.d, a file of its own that the daemon reads
          again and is there after a boot, beside a .json arcana keeps
          of it.
      - name: pkg-install
        doc: |
          pkg install -y of the packages names, on the host or in a
          running jail; with force, also of packages built for a newer
          FreeBSD (IGNORE_OSVERSION).
      - name: ntp
        doc: |
          The NTP servers the host keeps time by (Mplify 119 §12.2.2):
          names the servers, written into ntp.conf between arcana's
          marks, the lines there before taken out; with persist, ntpd
          enabled in rc.conf; ntpd restarted.  With remove, the marks
          and what is between them taken out and ntpd restarted.
      - name: rtadvd
        doc: |
          Router advertisements on an interface, for the hosts behind
          it to address themselves (SLAAC, MEF 70.2 §11.5): interface,
          and names, the prefix (a /64) and then the DNS servers to
          advertise (RDNSS), at most 8; an entry written into
          rtadvd.conf between arcana's marks, the interface's old one
          taken out; with persist, rtadvd enabled and the interface on
          rtadvd_interfaces in rc.conf; rtadvd restarted.  With remove,
          the interface's entry taken out, and rtadvd stopped when the
          block is empty.
      - name: ipsec-sa
        doc: |
          Manually keyed security associations for an ipsec(4)
          interface (Mplify 119 §10, R41-R50, R55): verb key, set,
          derive or clear, interface, reqid, the outer addresses
          tunnel-local and tunnel-remote, and as names the words
          spi-in n, spi-out n,
          enc aes-cbc|aes-gcm-16, auth hmac-sha1|hmac-sha2-256|
          hmac-sha2-512 (not with gcm), key-in hex, key-out hex,
          akey-in hex, akey-out hex, and the flags encap (ESP in UDP,
          port 4500) and esn.  Written as a file for setkey(8), ESP in
          tunnel mode with the reqid, and taken out again; the keys
          are not in the trace.  clear deletes every SA between the
          two addresses.  key makes the interface its X25519 pair,
          kept 0600, the public half in the sdwan read; derive takes
          peer, the far public half, and epoch n, and computes both
          directions from the agreement by HKDF-SHA256, the same on
          both ends (R51-R54); lifetime s is kept with the SAs.  A
          rotation (R110, R112): key with the word next makes the
          pair to come (its public half next in the read); derive
          with next and install in, then install out, puts the new
          SAs in beside the old, inbound first on both ends, the old
          outbound one out as the new goes in; commit takes the old
          inbound out and makes the next pair the pair.  A
          rotation that fails is a fault, key-rotation, until one is
          done.
      - name: jail-conf
        doc: |
          A jail made from the console, the way one is kept by hand: a
          file of its own, /etc/jail.conf.d/<jail>.conf, beginning
          with .include "/etc/jail.conf"; and holding its block and
          the .includes of its templates.  verb make writes it, text
          its whole content, read back by jail(8) -e before it is put
          in place (it defines the jail named and no other); with
          snapshot and dataset, the jail's dataset is made first from
          the base jail's snapshot, by zfs clone (copy clone) or zfs
          send | zfs recv (copy send, a copy of its own), mounted at
          path; with start, the jail is started.  What fails undoes
          what was done.  edit writes a made jail's file anew, text
          its whole content, read back the same way first, the file
          before kept beside it; a running jail keeps its path and takes
          the rest when restarted.  remove stops the jail, takes its file away,
          and with dataset destroys that dataset when it is mounted at
          the jail's path.  defaults writes text as /etc/jail.conf,
          the defaults every jail file includes, the file before kept
          beside it.  template writes text as /etc/jail.conf.d/<name>
          .inc, names its one name; untemplate takes one away that no
          jail includes.
      - name: neighbour
        doc: |
          A neighbour set by hand, ARP's or NDP's, with arp(8) or ndp(8)
          (-s, -d): verb add or delete, address, and for add lladdr,
          its link address; with temporary it ages out as the others
          do, without it it stays (permanent).  With persist it is
          kept for a boot as a pair of rc.conf's static_arp_pairs or
          static_ndp_pairs, and with live too it is set now.  In the
          jail whose network it is when jail names one.
      - name: cert
        doc: |
          A certificate OpenSSL trusts, with certctl(8): verb add puts the
          PEM certificate text in ${LOCALBASE}/share/certs/trusted as
          path, remove takes one of those away, untrust puts a copy of
          path of /etc/ssl/certs in ${LOCALBASE}/share/certs/untrusted,
          trust takes the copies of path of /etc/ssl/untrusted away from
          there; each then certctl rehash, which rehash alone is.
      - name: ssh
        doc: |
          The base system's sshd(8): verb banner writes text as
          /etc/ssh/banner and names it Banner (no text: Banner none);
          set puts the setting path with names as its values (none: the
          line taken away), of AllowUsers, AllowGroups, DenyUsers,
          DenyGroups, PermitRootLogin, PasswordAuthentication,
          KbdInteractiveAuthentication, PubkeyAuthentication,
          X11Forwarding, MaxAuthTries and Port; sign signs each host key
          with the CA private key in text (names its principals) for 52
          weeks and names each certificate HostCertificate; user-cas
          writes the CA public keys in text, one a line, as
          /etc/ssh/trusted_user_ca_keys and names it TrustedUserCAKeys
          (no text: the line taken away), so that users sign in with
          certificates those CAs signed.  Each is read
          by sshd -t first, the file before kept beside it
          (sshd_config.arcana-before) and put back in safe mode, and sshd
          reloaded.  authorize adds the key line text to user's
          authorized_keys, unauthorize takes away the key whose
          fingerprint text is.  In jail's when jail names one.
      - name: carp
        doc: |
          An address that hosts on one network share with carp(4), held
          by the one that is MASTER of its virtual host: verb add makes
          the vhid on interface (or changes it) through carp's netlink
          family and puts address under it with ifconfig; set changes
          the vhid; remove takes address off, the vhid going with its
          last.  args are word=value: vhid (1-255), advbase, advskew,
          version (2 CARP, 3 VRRPv3, when it is made), prio and
          interval (VRRPv3), state (master or backup, set now only);
          preshared_key is the vhid's key, never on a command line.
          With persist the address is kept as an ifconfig_<if>_alias
          line with the vhid's words, its key too, and carp in kld_list.
          Only add is taken back in safe mode.  In jail's network when
          jail names one.
  - name: job-state
    type: enum
    entries:
      - queued
      - running
      - name: done
        doc: Finished; ok says how.
      - name: cancelled
        doc: Removed from the queue before it ran.
      - name: unconfirmed
        doc: |
          The change is made and waits for job-confirm; without it in
          time, it is undone.
  - name: max-json
    type: const
    value: 4194304
  - name: net-kind
    type: enum
    entries:
      - name: routes
        doc: The routing table, netstat -rnW.
      - name: nexthops
        doc: The nexthop table, netstat -onW.
      - name: connections
        doc: Active connections, netstat -n.
      - name: sockets
        doc: Open sockets with their owners, sockstat.
      - name: interfaces
        doc: |
          The network interfaces with their addresses, flags, link and
          counters, from getifaddrs(3), as a JSON object with the array
          "interfaces" and "time", the milliseconds of a clock that only
          runs forward, to make rates of the counters.
      - name: netgraph
        doc: |
          The netgraph(4) nodes with their hooks, from ngctl(8) list -l,
          as a JSON object with the array "nodes".
      - name: wireguard
        doc: |
          The WireGuard interfaces with their peers, from wg(8) show,
          as a JSON object with the array "interfaces".  Public keys
          only; of a private or a preshared key, that there is one.
      - name: bird
        doc: |
          What birdc(8) tells of the BIRD routing daemon, as a JSON
          object with "status", its lines, the array "protocols", each
          with what show protocols all says of it (a BGP neighbour's
          address and AS, its channels with their filters and how many
          routes came and went), the OSPF neighbours in "ospf", the BFD
          sessions in "bfd" (each with its protocol, address, interface,
          state, since, interval and timeout), and the routing tables
          with how many routes each holds in "tables".
      - name: bird-routes
        doc: |
          Routes of BIRD's tables, from birdc(8) show route, as a JSON
          object with the array "routes": each with its table, prefix,
          type, protocol, since, from, primary, preference, info, its
          "nexthops" and, when asked with all, its attributes in
          "attrs".  net-filter says which, in birdc's own words: for
          and an address, or a prefix; protocol or export and a
          protocol's name; table and a table's name; all.  More routes
          than a reply should carry are counted, not sent.
      - name: bridges
        doc: |
          The bridges, if_bridge(4), as a JSON object with the array
          "bridges": each with its spanning tree (protocol, its own
          identifier and the root's, the root port and cost, the
          timers), whether it filters VLANs, and its "members", each
          with its flags, port number, priority and path cost, its
          role and state in the spanning tree, the VLAN it is in
          untagged and those it carries tagged, and the addresses it
          has, which a member should not have; and "learned", the
          addresses the bridge has learned, each with its mac, vlan,
          the member it is behind and when it expires, the first 500
          of learned_total.
      - name: geneve
        doc: |
          The geneve(4) tunnels, as a JSON object with the array
          "geneves": each with its mode, identifier, local and remote
          or group address and ports, device, ttl, df, and its
          forwarding table's settings.
      - name: ipfw
        doc: |
          The firewall, ipfw(8), as a JSON object: "loaded" and
          "enabled"; "rules", each with its number, set, counters and
          text, and whether its set is disabled; "tables", each with
          its name, type, count and the first of its entries (key,
          value); "nat" and "pipes", as ipfw shows them; "qos", the
          pipes, schedulers and queues of dummynet as objects: "pipes"
          (num, bw in bits a second, 0 for none, delay ms, burst,
          slots or bytes, plr, mask), "scheds" (num, bw, delay, type,
          mask, queues, the queues that feed it, and params) and
          "queues" (num, sched, weight, pri, slots or bytes, plr, mask,
          red), a mask with src and dst, prefix lengths, the ports and
          proto; "verbose";
          "kept", the rules of the kept file each with its number and
          text, "other" its lines that are not rules, "path" where it
          is and "rc" what rc.conf says of the firewall.
      - name: nhgroups
        doc: |
          The kernel's nexthop groups, what a route of several next
          hops (ECMP) points to, as netstat -O prints them: each with
          its index, how many routes use it, and its next hops with
          the share of each.
      - name: neighbours
        doc: |
          The neighbours, ARP's and NDP's, asked of the kernel through
          netlink(4): a JSON object with the array "neighbours", each
          with its family, address, link-level address, interface,
          state (reachable, stale, delay, probe, incomplete, permanent)
          and when it moves on ("next", seconds of the kernel's uptime),
          with "router" for a router; and "total", how many there are
          before the filter.
      - name: ipsec
        doc: |
          strongSwan's IPsec, from swanctl(8): a JSON object with
          "running", whether its daemon answers; "public-key", the
          host's own, of verb init, in base64; "connections", each with
          its name, version, addresses, identities, whether arcana
          wrote it ("arcana") and its children with their mode, reqid
          and traffic selectors; and "sas", the security associations,
          IKE and their children, with state, algorithms and counters.
          Never a private key.
  - name: storage-kind
    type: enum
    entries:
      - name: disks
        doc: |
          The disks and the partitions of each, from GEOM, with what
          camcontrol(8) says each disk is.
      - name: pools
        doc: The ZFS pools with their devices, from zpool(8).
      - name: datasets
        doc: The ZFS file systems and volumes, from zfs(8).
      - name: snapshots
        doc: |
          The ZFS snapshots, the newest first; of the dataset
          net-filter names and those under it, or of all.
      - name: mounts
        doc: What is mounted, and what fstab(5) says to mount.
      - name: importable
        doc: |
          The pools zpool(8) finds on the host's devices that are not
          imported.
      - name: health
        doc: |
          How the disks are, as they say themselves, as a JSON object
          with "disks": each with its name; "by", the program that
          asked it (nvmecontrol for an NVMe disk, smartctl of
          smartmontools for another, when the host has it); "ok",
          whether it says it is well; its temperature in Celsius,
          power_on_hours, power_cycles; for an NVMe disk used_pct and
          spare_pct, media_errors and unsafe_shutdowns; for another
          the raw values of reallocated, pending, uncorrectable,
          crc_errors and what it has of wear_level, life_left and
          media_wearout; and "note", why it was not asked.
  - name: net-family
    type: enum
    entries:
      - name: all
      - name: inet
      - name: inet6
  - name: max-binary
    type: const
    doc: The largest arcana-agent an update carries; a frame is 8 MiB.
    value: 6291456
  - name: max-output
    type: const
    value: 262144
  - name: action
    type: enum
    entries:
      - start
      - stop
      - restart
      - name: kill
        doc: Remove the jail with jail_remove(2), without its stop scripts.
  - name: jail-state
    type: enum
    entries:
      - running
      - stopped
      - dying
      - absent
  - name: service-action
    type: enum
    entries:
      - start
      - stop
      - restart
      - reload
      - name: enable
        doc: sysrc(8) sets the service's rcvar to YES.
      - name: disable
        doc: sysrc(8) sets the service's rcvar to NO.
  - name: step-kind
    type: enum
    entries:
      - daemon
      - lib
      - syscall
      - file
      - exec
  - name: step-status
    type: enum
    entries:
      - ok
      - failed
      - incomplete

attribute-sets:
  - name: arcana
    attributes:
      - name: jail
        type: text
        checks:
          min-len: 1
          max-len: 255
      - name: action
        type: u8
        enum: action
      - name: address
        type: text
        doc: An IPv4 or IPv6 address, optionally with /prefixlen.
        checks:
          min-len: 2
          max-len: 64
      - name: interface
        type: text
        checks:
          min-len: 1
          max-len: 15
      - name: remove
        type: flag
        doc: Remove the address instead of adding it.
      - name: live
        type: flag
        doc: Change the running jail.
      - name: persist
        type: flag
        doc: Change the jail's configuration file.
      - name: dry-run
        type: flag
        doc: Change nothing; report the plan and the diff.
      - name: config-only
        type: flag
        doc: List configured jails without looking at running ones.
      - name: ok
        type: bool
      - name: error
        type: text
      - name: host
        type: nest
        nested-attributes: host
      - name: jails
        type: nest
        nested-attributes: jail
        multi-attr: true
        checks:
          max-count: max-jails
      - name: result
        type: nest
        nested-attributes: jail
        doc: The jail as it is after the operation.
      - name: diff
        type: text
        doc: Unified diff of the configuration change.
      - name: scopes
        type: text
        multi-attr: true
        doc: Configuration files jail(8) is run with (-f).
      - name: conf-errors
        type: nest
        nested-attributes: conf-error
        multi-attr: true
      - name: trace
        type: nest
        nested-attributes: step
        multi-attr: true
        checks:
          max-count: max-steps
      - name: service
        type: text
        doc: An rc.d script's name.
        checks:
          min-len: 1
          max-len: 64
      - name: service-action
        type: u8
        enum: service-action
      - name: services
        type: nest
        nested-attributes: service
        multi-attr: true
        checks:
          max-count: max-services
      - name: service-result
        type: nest
        nested-attributes: service
        doc: The service as it is after the operation.
      - name: variables
        type: nest
        nested-attributes: variable
        multi-attr: true
        doc: rc.conf variables of a service, to set or as they are.
      - name: description
        type: text
        doc: What the script says of itself (service describe).
      - name: net-kind
        type: u8
        enum: net-kind
      - name: net-family
        type: u8
        enum: net-family
      - name: json
        type: text
        doc: What the program printed with --libxo json, as it is.
        checks:
          max-len: max-json
      - name: stats
        type: nest
        nested-attributes: stats
      - name: batch
        type: nest
        nested-attributes: job-spec
        multi-attr: true
        doc: Jobs to queue, run in this order.
        checks:
          min-count: 1
          max-count: max-batch
      - name: jobs
        type: nest
        nested-attributes: job
        multi-attr: true
      - name: job
        type: nest
        nested-attributes: job
      - name: id
        type: u64
        doc: A job's number, unique while the daemon runs.
      - name: packages
        type: nest
        nested-attributes: package
        multi-attr: true
        doc: Packages with a newer version in the repository.
        checks:
          max-count: max-packages
      - name: names
        type: text
        multi-attr: true
        doc: Package names to upgrade; none means all of them.
        checks:
          max-count: max-packages
      - name: refresh
        type: flag
        doc: Fetch the repository catalogue first (pkg update).
      - name: upgraded
        type: u32
        doc: How many packages pkg upgrade reported.
      - name: commands
        type: text
        multi-attr: true
        doc: The script's extra commands (service extracommands).
      - name: binary
        type: bytes
        doc: A new arcana-agent, for this host's system and machine.
        checks:
          max-len: max-binary
      - name: sha256
        type: text
        doc: The SHA-256 of binary, in hex.
        checks:
          max-len: 64
      - name: source
        type: text
        doc: A git repository with the Arcana tree, as git clone takes it.
        checks:
          max-len: 1024
      - name: ref
        type: text
        doc: The branch or tag to build; the repository's default if absent.
        checks:
          max-len: 128
      - name: net-filter
        type: text
        doc: |
          For the routes: keep the rows that contain this text, searched
          for on the host, which a table too large to send needs.
        checks:
          max-len: 128
      - name: total
        type: u64
        doc: Rows in the table on the host, when not all were sent.
      - name: truncated
        type: flag
        doc: More rows matched than the reply carries.
      - name: activity
        type: text
        doc: What holds the daemon's change lock now, if it is not a job.
      - name: since
        type: s64
        doc: Unix time activity began.
      - name: stopping
        type: flag
        doc: The daemon was told to stop and waits for what is under way.
      - name: host-keys
        type: text
        doc: |
          SSH host keys of the repository's server, as known_hosts lines.
          In a reply: what ssh-keyscan found, for the user to confirm
          when this host does not know the server.  In a request: the
          lines confirmed, which this host keeps and checks the server
          against from then on.
        checks:
          max-len: 8192
      - name: ssh-key
        type: text
        doc: |
          A private key on this host for git to show the repository's
          server, instead of the one this host makes for itself.
        checks:
          max-len: 1024
      - name: fingerprints
        type: text
        multi-attr: true
        doc: The fingerprints of host-keys, as ssh-keygen -l prints them.
      - name: deploy-key
        type: text
        doc: |
          The public key this host shows the repository's server, to be
          allowed there as a read-only deploy key.
        checks:
          max-len: 1024
      - name: restart
        type: flag
        doc: Restart the service once the new program is in place.
      - name: restarting
        type: flag
        doc: The service is being restarted; the connection will drop.
      - name: agent-version
        type: text
        doc: The version the program in place reports.
        checks:
          max-len: 64
      - name: net-fib
        type: u32
        doc: The routing table to read or look in; 0 when not given.
      - name: lookup
        type: text
        doc: An IPv4 or IPv6 address to find the route to.
        checks:
          min-len: 2
          max-len: 64
      - name: conf-path
        type: text
        doc: |
          A file of BIRD's configuration; its main one when not given.
        checks:
          max-len: 255
      - name: conf-text
        type: text
        doc: A configuration file's whole text.
        checks:
          max-len: max-json
      - name: files
        type: text
        multi-attr: true
        doc: The files BIRD's configuration is made of.
      - name: safe
        type: flag
        doc: |
          For bird-config: the daemon is told to take the new
          configuration back by itself (configure timeout) unless it is
          confirmed within the time the agent allows, and the file is
          then put back as it was.
      - name: confirm
        type: flag
        doc: |
          For bird-config: the change made with safe stays.  A client
          that still reaches the host after the change says so.
      - name: confirm-by
        type: s64
        doc: After a change with safe, the Unix time it is taken back at.
      - name: storage-kind
        type: u8
        enum: storage-kind
      - name: retry
        type: flag
        doc: |
          For transport: start the SCTP listeners that are not up, now
          that the kernel can.
      - name: offset
        type: u32
        doc: |
          For the routes of network: how many of the rows that would
          be sent to leave out first, to read on in a table too large
          for one reply.
      - name: log-name
        type: text
        doc: For log, the file in the host's log directory to read.
        checks:
          max-len: 128
      - name: position
        type: u64
        doc: |
          For log, the byte of the file to read on from: what a reply
          before gave as where it ended.
      - name: lines
        type: u32
        doc: For log, how many lines to send at most.
      - name: after
        type: u64
        doc: |
          For history, the time, in seconds since the epoch, after
          which samples are asked for.  For events, the number of the
          last event the asker has.
      - name: sample-step
        type: u32
        doc: For history, the seconds between two samples, 1 to 3600.
      - name: sample-keep
        type: u32
        doc: |
          For history, how many samples the agent keeps, at most 5000;
          with 0 it does not sample and holds no memory for it.
      - name: pid
        type: u32
        doc: For processes, the one to say more of.
      - name: limit-cpu
        type: u32
        doc: |
          For history, the percentage of the CPUs busy above which an
          event is made, and another when it falls under it again; 0
          for none.
      - name: limit-mem
        type: u32
        doc: For history, the same for the memory in use.
      - name: limit-swap
        type: u32
        doc: For history, the same for the swap in use.
      - name: routes
        type: nest
        nested-attributes: route
        multi-attr: true
        doc: The routes of a part of network's dump of the routes.
      - name: seconds
        type: u32
        doc: For fw-trace, how long to follow, at most.
        checks:
          min: 1
          max: 60
      - name: packets
        type: u32
        doc: For fw-trace, how many packets to follow, at most.
        checks:
          min: 1
          max: 1000
      - name: ignore-osversion
        type: bool
        doc: |
          For pkg-upgrade, pkg told to install packages built for a
          newer FreeBSD than the host's (IGNORE_OSVERSION), which it
          refuses otherwise.
      - name: pkg-installed
        type: bool
        doc: |
          For packages, the packages installed (pkg query, from the
          host's own database, without the repository) and not those
          the repository has newer versions of.
      - name: pkg-ip
        type: u8
        doc: |
          For packages and pkg-upgrade, the repository reached over
          IPv4 only (4, pkg -4) or IPv6 only (6, pkg -6); 0 or none
          either.
        checks:
          max: 6
      - name: limit-rules
        type: text
        doc: |
          For history, with how to sample: the limits of one device or
          jail each, with commas: net:<interface>=<bytes a second, in
          and out>, disk:<disk>=<bytes a second, read and written>,
          jail-cpu:<jail>=<percent of one CPU>, jail-mem:<jail>=<bytes>.
          An event (threshold) when one is crossed, either way; empty
          takes them all away, and none given leaves them as they are.
        checks:
          max-len: 2048
      - name: zfs-recursive
        type: flag
        doc: For zfs-send, the datasets under the snapshot's too (-R).
      - name: from-rc
        type: flag
        doc: |
          For ipfw-rules, nothing written: the script rc.conf's
          firewall_script names, or the file firewall_type names, as
          kept rules.
      - name: rc-file
        type: text
        doc: For ipfw-rules with from-rc, the file that was read.
      - name: commit
        type: text
        doc: |
          The commit of a repository: what source-head found at its
          head, or what agent-build and console-update built.
        checks:
          max-len: 64
      - name: count
        type: u32
        doc: How many at most.
      - name: log
        type: text
        doc: |
          The latest commits of a repository's branch, newest first,
          as a JSON list: each its commit, time, subject and body.
        checks:
          max-len: max-output
      - name: tags
        type: text
        doc: |
          The repository's tags, newest first, as a JSON list: each its
          name, time and message; the release notes where their
          messages are.
        checks:
          max-len: max-output
      - name: safe-wait
        type: u32
        doc: |
          For bird-config with safe: the seconds the change waits to be
          confirmed before it is taken back, in place of the agent's own
          (-w); the console's rollback timer for the host.
        checks:
          min: 10
          max: 3600
      - name: zfs-dataset
        type: text
        doc: For zfs-key, the encrypted dataset.
        checks:
          max-len: 255
      - name: zfs-key
        type: text
        doc: |
          For zfs-key, the dataset's key as it is typed: a passphrase,
          or 64 hex digits for keyformat hex.
        checks:
          max-len: 512
      - name: zfs-new-key
        type: text
        doc: For zfs-key, the key it is to have from now on.
        checks:
          max-len: 512
      - name: tls-verb
        type: text
        doc: For tls, status, csr or install.
        checks:
          max-len: 16
      - name: tls-cert
        type: text
        doc: |
          For tls install, the host's new certificate as PEM, the
          intermediate CAs after it.
        checks:
          max-len: 32768
      - name: tls-ca
        type: text
        doc: |
          For tls install, the CAs the host is to trust from now on, as
          PEM, one after the other.
        checks:
          max-len: 65536
      - name: tls-peer
        type: text
        doc: |
          For tls install, the asking console's own certificate as PEM,
          its intermediate CAs after it: the host takes the change only
          when that one is still trusted afterwards.
        checks:
          max-len: 32768
      - name: secrets
        type: flag
        doc: |
          For config-export, the secrets with the files too: keys and
          shared secrets (WireGuard's, strongSwan's, the agent's own
          never).
      - name: bundle
        type: text
        doc: For config-apply, a host's bundle, as config-export made it.
        checks:
          max-len: max-json
      - name: anyway
        type: flag
        doc: |
          For config-apply, though the hardware is not the bundle's: an
          interface or a disk it names is not on this host.
      - name: new-hostname
        type: text
        doc: For config-apply, the host's name instead of the bundle's.
        checks:
          max-len: 255
      - name: path-src
        type: text
        doc: For path-check, the packet's source address.
        checks:
          max-len: 64
      - name: path-dst
        type: text
        doc: For path-check, its destination address.
        checks:
          max-len: 64
      - name: path-proto
        type: text
        doc: For path-check, tcp, udp, icmp or ip (any).
        checks:
          max-len: 8
      - name: path-port
        type: u32
        doc: For path-check, the destination port of tcp or udp.


  - name: host
    attributes:
      - name: hostname
        type: text
      - name: sysname
        type: text
      - name: release
        type: text
      - name: machine
        type: text
      - name: osreldate
        type: u32
      - name: ncpu
        type: u32
      - name: physmem
        type: u64
      - name: boottime
        type: s64
      - name: time
        type: s64
      - name: securelevel
        type: s32
      - name: privileged
        type: bool
      - name: version
        type: text
        doc: arcana-agent version.
      - name: build
        type: text
        doc: |
          The SHA-256 of the running arcana-agent, in hex: two builds of
          one version differ in it.
        checks:
          max-len: 64
      - name: plugins
        type: text
        multi-attr: true
        doc: |
          The plugins the host has: what works through a program that
          is not the base system's and is installed there.  bird is
          BIRD, through birdc(8); wireguard is WireGuard's keys and
          peers, through wg(8); strongswan is IPsec, through
          swanctl(8).

  - name: jail
    attributes:
      - name: name
        type: text
      - name: state
        type: u8
        enum: jail-state
      - name: jid
        type: u32
      - name: configured
        type: bool
      - name: scope
        type: text
        doc: The configuration file that defines the jail.
      - name: hostname
        type: text
      - name: path
        type: text
      - name: ip4
        type: text
        multi-attr: true
      - name: ip6
        type: text
        multi-attr: true
      - name: vnet
        type: bool
      - name: osrelease
        type: text
      - name: persist
        type: bool
      - name: securelevel
        type: s32
      - name: parent
        type: u32
      - name: children
        type: u32
      - name: nproc
        type: u32
      - name: rss-kb
        type: u64
      - name: cpu-pct
        type: float
      - name: interface
        type: text
      - name: params
        type: nest
        nested-attributes: param
        multi-attr: true
        doc: Configured parameters as jail(8) resolves them.
      - name: plugins
        type: text
        multi-attr: true
        doc: |
          Of a running jail with a network of its own: the plugins it
          has, as a host's, by the programs installed in the jail.

  - name: param
    attributes:
      - name: key
        type: text
      - name: values
        type: text
        multi-attr: true

  - name: service
    attributes:
      - name: name
        type: text
      - name: path
        type: text
        doc: The script, in /etc/rc.d or /usr/local/etc/rc.d.
      - name: rcvar
        type: text
        doc: The rc.conf variable that enables it, if it has one.
      - name: enabled
        type: bool
      - name: running
        type: bool
        doc: What "service <name> status" says; absent when not asked.
      - name: pid
        type: u32
      - name: status
        type: text
        doc: The status line, as the script printed it.

  - name: variable
    attributes:
      - name: key
        type: text
      - name: value
        type: text
      - name: remove
        type: flag
        doc: In a request, unset the variable instead (sysrc -x).

  - name: stats
    doc: How busy the host is, at this moment.
    attributes:
      - name: cpu-pct
        type: float
        doc: Of all CPUs, since the previous sample (kern.cp_time).
      - name: load1
        type: float
      - name: load5
        type: float
      - name: load15
        type: float
      - name: mem-total
        type: u64
        doc: Bytes.
      - name: mem-used
        type: u64
        doc: Active, wired and laundry pages.
      - name: mem-inactive
        type: u64
      - name: mem-free
        type: u64
      - name: swap-total
        type: u64
      - name: swap-used
        type: u64
      - name: pools
        type: nest
        nested-attributes: pool
        multi-attr: true
        doc: ZFS pools, from zpool list.

  - name: job-spec
    doc: One change to queue; the attributes its kind needs.
    attributes:
      - name: kind
        type: u8
        enum: job-kind
      - name: jail
        type: text
        checks:
          max-len: 255
      - name: action
        type: u8
        enum: action
      - name: address
        type: text
        checks:
          max-len: 64
      - name: interface
        type: text
        checks:
          max-len: 15
      - name: remove
        type: flag
      - name: live
        type: flag
      - name: persist
        type: flag
      - name: service
        type: text
        checks:
          max-len: 64
      - name: service-action
        type: u8
        enum: service-action
      - name: variables
        type: nest
        nested-attributes: variable
        multi-attr: true
      - name: names
        type: text
        multi-attr: true
      - name: up
        type: bool
        doc: For if-state.
      - name: safe
        type: flag
        doc: |
          Undo the change unless job-confirm comes for the job within
          the time the daemon allows.  A client that can still reach the
          daemon after the change confirms; one the change cut off
          cannot, and the host comes back by itself.  For the changes
          that can be taken back: if-address, if-state, if-set,
          if-create, route, address, service-config, and a service's
          start, stop, enable and disable.
      - name: destination
        type: text
        doc: |
          For route, as default, a network with its prefix length, or a
          host address.
        checks:
          max-len: 64
      - name: gateway
        type: text
        doc: |
          For route, an address, or the name of an interface; or
          several addresses with a comma between, each with its share
          after an @ when it has one (10.0.0.1@2,10.0.0.2), for a
          route with as many next hops.
        checks:
          max-len: 512
      - name: fib
        type: u32
        doc: |
          For route, the routing table; 0 when not given.  For if-set
          and if-create, the interface's: what is received on it is
          looked up there.
      - name: mtu
        type: u32
        doc: For if-set and if-create.
      - name: description
        type: text
        doc: For if-set and if-create.
        checks:
          max-len: 64
      - name: tunnel-local
        type: text
        doc: For if-create, a tunnel's outer address on this host.
        checks:
          max-len: 64
      - name: tunnel-remote
        type: text
        doc: For if-create, a tunnel's outer address at the far end.
        checks:
          max-len: 64
      - name: id
        type: u32
        doc: For if-create, a VLAN tag or a VXLAN identifier.
      - name: parent
        type: text
        doc: For if-create, the interface a VLAN rides or a bridge takes in.
        checks:
          max-len: 15
      - name: verb
        type: text
        doc: For netgraph, wireguard and bird, what to do.
        checks:
          max-len: 16
      - name: peer
        type: text
        doc: For wireguard, a peer's public key.
        checks:
          max-len: 44
      - name: endpoint
        type: text
        doc: For wireguard, where a peer is reached, as address and port.
        checks:
          max-len: 128
      - name: allowed-ips
        type: text
        doc: For wireguard, the networks a peer may send from, with commas.
        checks:
          max-len: 1024
      - name: keepalive
        type: u32
        doc: For wireguard, seconds between keepalives to a peer; 0 for none.
      - name: listen-port
        type: u32
        doc: For wireguard, the port the interface listens on.
      - name: recursive
        type: flag
        doc: For zfs, with those under it (-r).
      - name: force
        type: flag
        doc: For unmounting, though it is in use (-f).
      - name: metric
        type: u32
        doc: |
          For route, the cost of the route: of several to one
          destination the lowest is used (route -metric).
      - name: weight
        type: u32
        doc: |
          For route, its share among routes of the same metric to one
          destination (route -weight).
      - name: source
        type: text
        doc: |
          For route, the address of this host that what takes the route
          is sent from (route -ifa).
        checks:
          max-len: 64
      - name: pkg-ip
        type: u8
        doc: |
          For pkg-upgrade, the repository reached over IPv4 only (4,
          pkg -4) or IPv6 only (6, pkg -6).
        checks:
          max: 6
      - name: conn
        type: text
        doc: |
          For ipsec, the connection: letters, digits, - and _, kept in
          conf.d/arcana-<conn>.conf.
        checks:
          max-len: 32
      - name: ipsec-mode
        type: text
        doc: For ipsec conn, tunnel or transport.
        checks:
          max-len: 9
      - name: local-ts
        type: text
        doc: |
          For ipsec conn, this side's traffic selectors with commas, as
          swanctl.conf(5) writes them (2001:db8::1[gre]); none says the
          address itself in transport mode, everything in tunnel mode.
        checks:
          max-len: 512
      - name: remote-ts
        type: text
        doc: For ipsec conn, the peer's traffic selectors, as local-ts.
        checks:
          max-len: 512
      - name: pubkey
        type: text
        doc: |
          For ipsec conn, the peer's public key in base64 (DER), as the
          ipsec network kind tells it of that host.
        checks:
          max-len: 1024
      - name: reqid
        type: u32
        doc: |
          For ipsec conn, the reqid of the ipsec(4) interface it serves:
          tunnel mode, its policies the interface's.  For if-create of an
          ipsec interface, the reqid it is made with.
      - name: start-action
        type: text
        doc: |
          For ipsec conn: start, up at once and kept up; trap, up with
          the first packet that needs it (the default); none, only by
          up.
        checks:
          max-len: 5
      - name: local-id
        type: text
        doc: |
          For ipsec conn, this side's identity when it is not its
          address (behind NAT, the address it has there).
        checks:
          max-len: 128
      - name: remote-id
        type: text
        doc: For ipsec conn, the peer's identity, as local-id.
        checks:
          max-len: 128
      - name: tunnelfib
        type: u32
        doc: |
          For if-set and if-create of a tunnel (gif, gre, vxlan, geneve,
          wg), the routing table its outer packets are sent by.
      - name: child
        type: text
        doc: |
          For ipsec child and unchild, the child's name under the
          connection conn: its mode, traffic, reqid and start are the
          child's.
        checks:
          max-len: 32
      - name: local-cert
        type: text
        doc: |
          For ipsec conn, this host's certificate, a file in swanctl's
          x509 (its key in private or pkcs8), in place of the key
          arcana made it.
        checks:
          max-len: 128
      - name: remote-cert
        type: text
        doc: |
          For ipsec conn, the peer's certificate, a file in swanctl's
          x509, in place of its public key.
        checks:
          max-len: 128
      - name: remote-ca
        type: text
        doc: |
          For ipsec conn, a CA in swanctl's x509ca that signed the
          peer's certificate, which remote-id names, in place of its
          public key.
        checks:
          max-len: 128
      - name: addressing
        type: text
        doc: |
          For if-set, how the interface gets its address: dhcp
          (dhclient, by rc.conf's DHCP word, so with persist), slaac
          (inet6 accept_rtadv and rtsol, kept in ifconfig_<if>_ipv6)
          or static, which takes both off (Mplify 119 §12.2.3.2,
          §12.2.3.3).
        checks:
          max-len: 8
      - name: safe-wait
        type: u32
        doc: |
          With safe: the seconds the change waits to be confirmed
          before it is undone, in place of the agent's own (-w); the
          console's rollback timer for the host.
        checks:
          min: 10
          max: 3600
      - name: dataset
        type: text
        doc: For jail-conf, the jail's ZFS dataset.
        checks:
          max-len: 255
      - name: snapshot
        type: text
        doc: For jail-conf make, the base jail's snapshot it is made from.
        checks:
          max-len: 255
      - name: copy
        type: text
        doc: For jail-conf make, clone or send.
        checks:
          max-len: 8
      - name: path
        type: text
        doc: |
          For jail-conf, the jail's root, its dataset's mountpoint; for
          cert, the certificate's file name.
        checks:
          max-len: 1024
      - name: text
        type: text
        doc: |
          For jail-conf, a file's whole content; for cert add, the
          certificate as PEM.
        checks:
          max-len: 65536
      - name: start
        type: flag
        doc: For jail-conf make, the jail started once made.
      - name: preshared-key
        type: text
        doc: |
          For wireguard peer, the peer's preshared key, 44 characters of
          base64: given to wg(8) in a file of the agent's that is there
          only while it is read, and in no title nor trace.
        checks:
          max-len: 44
      - name: lladdr
        type: text
        doc: For neighbour add, the link address, six bytes of hex.
        checks:
          max-len: 17
      - name: temporary
        type: flag
        doc: For neighbour add, one that ages out as the others do.
      - name: user
        type: text
        doc: For ssh authorize and unauthorize, the user whose keys.
        checks:
          max-len: 32

  - name: job
    attributes:
      - name: id
        type: u64
      - name: kind
        type: u8
        enum: job-kind
      - name: title
        type: text
        doc: What it does, in words.
      - name: state
        type: u8
        enum: job-state
      - name: ok
        type: bool
        doc: With state done, whether it succeeded.
      - name: error
        type: text
      - name: created
        type: s64
        doc: Unix time it was queued.
      - name: started
        type: s64
      - name: finished
        type: s64
      - name: peer
        type: text
        doc: Who queued it.
      - name: confirm-by
        type: s64
        doc: With state unconfirmed, the Unix time it is undone at.
      - name: trace
        type: nest
        nested-attributes: step
        multi-attr: true
        doc: The steps so far; it grows while the job runs.

  - name: package
    attributes:
      - name: name
        type: text
      - name: installed
        type: text
        doc: The installed version.
      - name: available
        type: text
        doc: The repository's version.
      - name: automatic
        type: bool
        doc: |
          Installed as what another package needs, not asked for by
          name (pkg's automatic flag).
      - name: comment
        type: text
        doc: What it is, in a line.
      - name: size
        type: u64
        doc: Bytes it takes installed.
      - name: origin
        type: text
        doc: Its port, category/name.

  - name: pool
    attributes:
      - name: name
        type: text
      - name: size
        type: u64
      - name: alloc
        type: u64
      - name: free
        type: u64
      - name: health
        type: text

  - name: conf-error
    attributes:
      - name: scope
        type: text
      - name: message
        type: text

  - name: step
    attributes:
      - name: id
        type: u32
      - name: parent
        type: s32
        doc: Index of the parent step, -1 for the root.
      - name: kind
        type: u8
        enum: step-kind
      - name: label
        type: text
      - name: detail
        type: text
      - name: status
        type: u8
        enum: step-status
      - name: duration-us
        type: u64
      - name: argv
        type: text
        multi-attr: true
      - name: exit
        type: s32
      - name: output
        type: bytes
        doc: What the program wrote to standard output.
        checks:
          max-len: max-output
      - name: error-output
        type: bytes
        doc: What the program wrote to standard error.
        checks:
          max-len: max-output

  - name: route
    attributes:
      - name: family
        type: text
        doc: The table it is of, Internet or Internet6.
      - name: destination
        type: text
        doc: The prefix, or default.
      - name: gateway
        type: text
        doc: The next hop's address, or link#n for a route on a link.
      - name: flags
        type: text
        doc: Its flags as netstat -r writes them, UGS and so on.
      - name: nhop
        type: u32
        doc: The kernel's nexthop it uses.
      - name: mtu
        type: u32
      - name: interface-name
        type: text
      - name: metric
        type: u32
      - name: weight
        type: u32
        doc: Its share, against the other ways of a route of several.
      - name: fib
        type: u32
      - name: prefixlen
        type: u32
      - name: source
        type: text
        doc: The address it sends from, when it is set.
      - name: path
        type: u32
        doc: Which of the ways of a route of several (ECMP) this is.
      - name: paths
        type: u32
        doc: How many ways the route has.
      - name: expire-time
        type: u32
        doc: When a route that expires does.

  - name: part
    attributes:
      - name: json
        type: text
        doc: The next rows, a JSON array (connections, sockets, sysctl).
      - name: total
        type: u64
        doc: Rows in the table on the host.
      - name: routes
        type: nest
        nested-attributes: route
        multi-attr: true
        doc: The next routes, typed.
  - name: chunk
    attributes:
      - name: data
        type: bytes
        doc: The next bytes of what zfs send wrote, or receive is to read.
        checks:
          max-len: max-output

operations:
  - name: hello
    attribute-set: arcana
    auth: true
    do:
      reply:
        attributes:
          - host

  - name: list
    attribute-set: arcana
    auth: true
    do:
      request:
        attributes:
          - config-only
      reply:
        attributes:
          - ok
          - error
          - host
          - jails
          - scopes
          - conf-errors
          - trace

  - name: action
    attribute-set: arcana
    auth: true
    do:
      request:
        attributes:
          - jail
          - action
        required:
          - jail
          - action
      reply:
        attributes:
          - ok
          - error
          - result
          - trace

  - name: address
    attribute-set: arcana
    auth: true
    do:
      request:
        attributes:
          - jail
          - address
          - interface
          - remove
          - live
          - persist
          - dry-run
        required:
          - jail
          - address
      reply:
        attributes:
          - ok
          - error
          - result
          - diff
          - trace

  - name: services
    attribute-set: arcana
    auth: true
    doc: |
      The rc.d scripts of the host with whether they are enabled, and for
      the enabled ones whether they run.
    do:
      reply:
        attributes:
          - ok
          - error
          - services
          - trace

  - name: service-action
    attribute-set: arcana
    auth: true
    do:
      request:
        attributes:
          - service
          - service-action
        required:
          - service
          - service-action
      reply:
        attributes:
          - ok
          - error
          - service-result
          - trace

  - name: service-config
    attribute-set: arcana
    auth: true
    doc: |
      A service's rc.conf variables, read through sysrc(8); with
      variables in the request, set or unset them first.
    do:
      request:
        attributes:
          - service
          - variables
        required:
          - service
      reply:
        attributes:
          - ok
          - error
          - service-result
          - variables
          - description
          - commands
          - trace

  - name: network
    attribute-set: arcana
    auth: true
    doc: |
      The host's routing table, nexthops, connections or sockets, as
      netstat(1) and sockstat(1) print them with --libxo json.
      With jail, those of a running jail that has a network of its own
      (vnet), read from the host: nothing runs in the jail for it but
      the jail's own birdc and wg.  As a dump, the routes, connections
      and sockets come in parts as they are taken: each item has total,
      how many rows the table has, and the next rows: routes, typed,
      for the routes, and json, an array of them, for the connections
      and sockets; nothing is left out for size.
    do:
      request:
        attributes:
          - net-kind
          - net-family
          - net-filter
          - net-fib
          - jail
          - offset
        required:
          - net-kind
      reply:
        attributes:
          - ok
          - error
          - json
          - total
          - truncated
          - trace
    dump:
      request:
        attributes:
          - net-kind
          - net-family
          - net-filter
          - net-fib
          - jail
        required:
          - net-kind
      reply:
        attributes:
          - json
          - total
          - routes

  - name: stats
    attribute-set: arcana
    auth: true
    doc: CPU, memory, swap and ZFS pool usage of the host.
    do:
      reply:
        attributes:
          - ok
          - error
          - stats
          - trace

  - name: packages
    attribute-set: arcana
    auth: true
    doc: |
      Packages of the host, or of a running jail, that the repository has
      newer versions of (pkg version -vRl '<'), after pkg update with
      refresh; with pkg-installed, the packages installed instead, each
      with its version, origin, size, comment and whether it came
      automatically, read from the host's own database (pkg query)
      without asking the repository.
    do:
      request:
        attributes:
          - jail
          - refresh
          - pkg-installed
          - pkg-ip
      reply:
        attributes:
          - ok
          - error
          - packages
          - trace

  - name: pkg-upgrade
    attribute-set: arcana
    auth: true
    doc: |
      pkg upgrade -y on the host or in a running jail, of the named
      packages or of all; dry-run only shows what pkg would do;
      ignore-osversion upgrades to packages built for a newer FreeBSD
      too, as a job of kind pkg-upgrade does with force.
    do:
      request:
        attributes:
          - jail
          - names
          - dry-run
          - ignore-osversion
          - pkg-ip
      reply:
        attributes:
          - ok
          - error
          - upgraded
          - packages
          - trace

  - name: job-submit
    attribute-set: arcana
    auth: true
    doc: |
      Queue changes.  The daemon runs them one after another in the order
      given, whether or not the client stays connected, and keeps their
      outcome for job and jobs.
    do:
      request:
        attributes:
          - batch
        required:
          - batch
      reply:
        attributes:
          - ok
          - error
          - jobs

  - name: jobs
    attribute-set: arcana
    auth: true
    doc: |
      The queued, running and recent jobs, without their traces; and
      what the daemon is doing now that is not a job: a request a client
      waits for, which holds up changes and a stop as a job does.
    do:
      reply:
        attributes:
          - ok
          - jobs
          - activity
          - since
          - stopping

  - name: job
    attribute-set: arcana
    auth: true
    doc: One job with its trace so far.
    do:
      request:
        attributes:
          - id
        required:
          - id
      reply:
        attributes:
          - ok
          - error
          - job

  - name: job-cancel
    attribute-set: arcana
    auth: true
    doc: Take a job that has not started out of the queue.
    do:
      request:
        attributes:
          - id
        required:
          - id
      reply:
        attributes:
          - ok
          - error
          - job

  - name: job-confirm
    attribute-set: arcana
    auth: true
    doc: |
      Confirm a job that is unconfirmed: the change stays.  That the
      request arrived is the point: the client still reaches the host.
    do:
      request:
        attributes:
          - id
        required:
          - id
      reply:
        attributes:
          - ok
          - error
          - job

  - name: agent-update
    attribute-set: arcana
    auth: true
    doc: |
      Replace arcana-agent with the program sent.  It is checked against
      its SHA-256 and by running it with -V, on this host, before it
      takes the place of the one installed, which is kept beside it
      with the suffix .old.  With restart the service is restarted
      after the reply; otherwise the new program runs from the next
      start.
    do:
      request:
        attributes:
          - binary
          - sha256
          - restart
        required:
          - binary
          - sha256
      reply:
        attributes:
          - ok
          - error
          - agent-version
          - restarting
          - trace

  - name: agent-build
    attribute-set: arcana
    auth: true
    doc: |
      Build arcana-agent from a git repository on this host and return
      the program.  The tree is cloned afresh into the build directory
      and built with make(1), as an unprivileged user when the daemon
      is root; nothing is installed.
    do:
      request:
        attributes:
          - source
          - ref
          - host-keys
          - ssh-key
        required:
          - source
      reply:
        attributes:
          - ok
          - error
          - binary
          - sha256
          - agent-version
          - host-keys
          - fingerprints
          - deploy-key
          - trace
          - commit

  - name: console-update
    attribute-set: arcana
    auth: true
    doc: |
      Build the whole tree from a git repository on this host and install
      it, then restart the console's service: how a console updates
      itself, through the agent of the host it runs on.  The build runs
      as an unprivileged user when the daemon is root; make install runs
      as the daemon.  The repository is fetched as agent-build fetches
      it, host keys and all.
    do:
      request:
        attributes:
          - source
          - ref
          - host-keys
          - ssh-key
        required:
          - source
      reply:
        attributes:
          - ok
          - error
          - host-keys
          - fingerprints
          - deploy-key
          - restarting
          - trace
          - commit

  - name: route-lookup
    attribute-set: arcana
    auth: true
    doc: |
      The route this host would send a packet to an address by, as
      route(8) get tells it, and the other routes of its table that
      cover the address, which are what is left when the best one goes:
      a JSON object with "best" and the array "candidates", each with
      its prefix length.
    do:
      request:
        attributes:
          - lookup
          - net-fib
          - jail
        required:
          - lookup
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: bird-config
    attribute-set: arcana
    auth: true
    doc: |
      BIRD's configuration.  Without conf-text, read a file of it: the
      main one, or with conf-path one it includes; the reply has its
      text, the SHA-256 of that, and the files the configuration is made
      of.  With conf-text, put that in the file's place: sha256 must be
      that of the text it was made from, so that what somebody else
      changed meanwhile is not lost.  The whole configuration is parsed
      by bird(8) first, and what it refuses is not left in place; then
      the daemon is told to read it.  With dry-run it is parsed only,
      and the file left as it was.  With safe the daemon takes it back
      by itself unless a request with confirm comes by confirm-by, and
      the file is then as it was before.
    do:
      request:
        attributes:
          - conf-path
          - conf-text
          - sha256
          - dry-run
          - jail
          - safe
          - confirm
          - safe-wait
      reply:
        attributes:
          - ok
          - error
          - conf-path
          - conf-text
          - sha256
          - files
          - trace
          - confirm-by

  - name: kernel
    attribute-set: arcana
    auth: true
    doc: |
      The kernel's modules and its memory, as a JSON object: "files",
      every file linked into the kernel with its id, name, path, the
      references to it, its size, and the modules it holds; "available",
      the modules of the module path that are not loaded; "kept", what
      rc.conf's kld_list loads at boot; and "memory", with the sizes
      of the kernel's memory map and the largest of its malloc(9) types
      and uma(9) zones.
    do:
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: storage
    attribute-set: arcana
    auth: true
    doc: |
      The host's storage, as a JSON object, of the kind asked for.  More
      datasets or snapshots than a reply carries come as the first of
      them, with total and truncated.  With jail, the datasets or the
      snapshots that jail's own zfs list sees: those given to it.
    do:
      request:
        attributes:
          - storage-kind
          - net-filter
          - jail
        required:
          - storage-kind
      reply:
        attributes:
          - ok
          - error
          - json
          - total
          - truncated
          - trace

  - name: fstab
    attribute-set: arcana
    auth: true
    doc: |
      fstab(5).  Without conf-text, read it, with the SHA-256 of its
      text.  With conf-text, put that in its place: it has to be an
      fstab, and sha256 that of the text it was made from.  The one
      before is kept beside it.  With dry-run it is only checked.
    do:
      request:
        attributes:
          - conf-text
          - sha256
          - dry-run
      reply:
        attributes:
          - ok
          - error
          - conf-text
          - sha256
          - trace

  - name: transport
    attribute-set: arcana
    auth: true
    doc: |
      How the agent is reached, as a JSON object: "listeners", each
      with its uri, its transport (tcp, sctp or unix) and whether it is
      up, and why not when it is not; "sctp", whether the kernel has it;
      and "sessions", the connections open now, each with its
      transport, the address and the certificate's name of who is at
      the other end, and since when.  An agent that listens on TCP
      listens on SCTP at the same address and port as well, once the
      kernel has SCTP: it does not load it, and does not try by itself
      again.  With retry it tries now.
    do:
      request:
        attributes:
          - retry
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: sysctl
    attribute-set: arcana
    auth: true
    doc: |
      The kernel's state, sysctl(8), as a JSON object: "values", each
      with its name, its value as sysctl prints it, whether it can be
      set, and what it is said to be; "kept", what sysctl.conf(5) sets
      at boot.  net-filter is where in the tree to begin, a name or
      the start of one; without it the whole tree, of which more than
      a reply carries comes as the first, with total and truncated.
      As a dump the values come in parts, as the tree is walked and
      as fast as they are taken: each item has json, an array of the
      next of them, and nothing is left out for size.
    do:
      request:
        attributes:
          - net-filter
      reply:
        attributes:
          - ok
          - error
          - json
          - total
          - truncated
          - trace
    dump:
      request:
        attributes:
          - net-filter
      reply:
        attributes:
          - json
          - total

  - name: ipfw-rules
    attribute-set: arcana
    auth: true
    doc: |
      The kept rules of the firewall, a file of ipfw(8) commands, one
      a line.  Without conf-text, read it, with the SHA-256 of its
      text.  With conf-text, put that in its place, once ipfw has
      read it without doing it (ipfw -n) and found nothing wrong:
      sha256 is that of the text it was made from.  The one before is
      kept beside it.  With dry-run it is only checked.  jail is the
      vnet jail whose firewall it is.  With from-rc, the file the host
      (or the jail) loads now is read and made into kept rules, which
      are not written: the script rc.conf's firewall_script names, when
      it is not /etc/rc.firewall, its ipfw commands taken out of it
      (ipfw, its path or a variable holding it, the options off) and
      the shell's own lines left in as comments; else the file
      firewall_type names.  What
      applying does itself (flush, set, delete, options) is left in
      as comments.  sha256 is still the kept file's, for a change
      made from it.
    do:
      request:
        attributes:
          - conf-text
          - sha256
          - dry-run
          - jail
          - from-rc
      reply:
        attributes:
          - ok
          - error
          - conf-text
          - sha256
          - trace
          - rc-file

  - name: processes
    attribute-set: arcana
    auth: true
    doc: |
      What runs on the host, as a JSON object: "processes", each with
      its pid, ppid, user, jid and jail, state, nice, pri, threads, rss
      and size in bytes, time (the CPU seconds it has used), wcpu (the
      kernel's decayed share of one CPU, in percent, as top(1) shows
      it), cpu (its share between this look and the one before), in
      and out (blocks read and written) and io (blocks a second since
      the look before), start, comm and args; "jails", each jail with
      its jid, name, procs, threads, cpu, wcpu and rss added up;
      "ncpu"; and "elapsed", the seconds between the two looks.  With
      jail, only the processes of that jail.  With pid, one process
      alone and more of it: "files", each with its fd, type, path or
      socket's addresses; "threads", each with its tid, name, state,
      priority and cpu.
    do:
      request:
        attributes:
          - jail
          - pid
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: log
    attribute-set: arcana
    auth: true
    doc: |
      A log of the host, as syslogd(8) wrote it, as a JSON object:
      "files", the logs of the log directory that can be read, each
      with its name, size and when it was last written; "name", the
      one read (messages, when log-name names none); "lines", its last
      lines, each with its time, host, tag, pid and text when the line
      is one of syslog's, with level when syslogd writes one (-v),
      and its text alone when not; "position", where the file ended;
      and "rotated", when the file is shorter than position said.
      A packed log (.bz2, .gz, .xz, .zst) is unpacked to be read,
      and not followed.  @dmesg is the kernel's message buffer,
      followed as it comes: each line has seq, its number, and seen,
      when the agent saw it (none for what was there when it
      started); position is then the newest number, after which
      the next asking is answered.  @audit the audit trail of now (praudit).  With jail, the logs
      of that jail's own /var/log.  With net-filter only the lines that have
      that text in them, in either case.  With position only what was
      written after it, which is how a log is followed.  lines is how
      many to send at most: 200, when it is not given.
    do:
      request:
        attributes:
          - log-name
          - net-filter
          - position
          - lines
          - jail
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: history
    attribute-set: arcana
    auth: true
    doc: |
      How busy the host has been, which the agent samples by itself
      and keeps the last of, as a JSON object: "step", the seconds
      between two samples; "keep", how many are kept; "bytes", the
      memory that takes; "fields", the names of what a sample begins
      with, in order (t, cpu, load, mem, swap, rx, tx, read, write: a
      time, a percentage, the load average, bytes of memory and of
      swap in use, bytes a second received and sent on all interfaces
      but the loopback, and read from and written to all disks);
      "nets" and "disks", the names of the interfaces and the disks
      told apart, at most 16 of each; "samples", each an array of the
      fields, then bytes a second in and out of each of nets, then
      read and written of each of disks; "mem_total", "swap_total" and
      "ncpu".  With after only the samples after that time.  With
      sample-step and sample-keep, both, the agent first samples that
      way from now on, and keeps it for its next start: an hour every
      five seconds until it is told otherwise; limit-cpu, limit-mem
      and limit-swap with them are the percentages above which an
      event (kind threshold) is made, and limit-rules the limits of an
      interface, a disk or a jail.  The reply has "limits", and
      "rules", each with its kind, name, limit and whether it is over.
      Each running jail is told apart as well, at most 16, in "jails":
      its share of one CPU in percent and its memory in bytes, as the
      kernel's resource accounting has them, follow the disks' in a
      sample.  That needs kern.racct.enable=1 in loader.conf(5):
      "racct" says whether the kernel accounts.  The
      samples are written down when the agent stops and every few
      minutes, and read again when it starts.
    do:
      request:
        attributes:
          - after
          - sample-step
          - sample-keep
          - limit-cpu
          - limit-mem
          - limit-swap
          - limit-rules
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: events
    attribute-set: arcana
    auth: true
    doc: |
      What happened on the host, as it happened, as a JSON object:
      "events", each with its number n, its time t, its kind and data,
      what it is about; "last", the number of the newest; "first",
      that of the oldest still kept, of "kept" at most.  With after
      only the events of a greater number: asked again with the last
      number seen, none is missed, unless first is beyond it.  The
      kinds: route-add and route-del, a route with its attributes as
      network's routes have them; routes, with changed, how many more
      routes changed in a second than are said one by one; link and
      link-del, an interface with up, carrier and mtu; address-add
      and address-del, an interface's address and prefixlen; neigh
      and neigh-del, a neighbour (ARP, NDP) as network's neighbours
      has one.  They are the kernel's own netlink(4) messages, of the
      host's network, and of each jail's own (vnet) too: one of a
      jail's has "jail", its name, beside its kind.  threshold, with
      what (cpu, mem, swap, net, disk, jail-cpu or jail-mem; the last
      four with name, the device's or the jail's), value, limit and
      over, when a figure of history crosses its limit, either way.
      kmsg, with seq and text, a line the kernel wrote, the moment the
      agent sees it; or with more, how many came in that second
      beyond the twenty said one by one.  sdwan-tunnel, with id,
      address, state (up or down) and misses, when a tunnel the agent
      measures (sdwan-probes) goes down or comes up, or by bfd when
      BFD says so.  sdwan-fault, with type, severity, object, by,
      description and state (set or cleared), when a fault is seen or
      cleared (Mplify 119 §11.3): the sdwan reply lists the day's.
      sdwan-security, with seq, rule, action, src, dst, iface and
      comment, when a rule logged to the routing socket (ipfw's logdst
      rtsock) sees a packet: the security policies' denies; twenty a
      second at most, the rest counted into the record.  The sdwan reply
      has "rules" (the set, how many rules and which tables),
      "steer" (each prefix's candidates with their states and which
      is chosen), "record" (count, the day's; seq; last, the latest
      500, each t, seq, rule, action, src, dst, iface, comment) and
      "proxy" (each instance's name, fib, mode, running and ca, its
      certificate) too.  job, with id, title, ok and error, when a
      job ends.  jail-state, with jail, state (running or stopped) and
      jid, when a jail is made or removed, the host's or one made in a
      jail (its name parent.child), as kqueue(2)'s EVFILT_JAIL tells
      it.  crash, with pid, process (its name), jid, jail (its name,
      empty for the host's), uid, signal and core (whether it dumped
      one), when the kernel says a process died of a signal that
      dumps core (kern.logsigexit).
    do:
      request:
        attributes:
          - after
      reply:
        attributes:
          - ok
          - error
          - json
          - trace
  - name: event
    attribute-set: arcana
    mcgrp: events
    doc: |
      One event, the moment it happens: json is it as events has
      one, {"n","t","kind","data"}, of the same number.  What is sent
      while nobody listens is not kept for them; events has the last
      512, to read what came before a subscription or while it was
      gone.
    event:
      attributes:
        - json

  - name: fw-trace
    attribute-set: arcana
    auth: true
    doc: |
      Packets followed by the kernel itself through the firewall: each
      that ipfw decides on whose source or destination is net-filter
      (an address), as the kernel's ipfw:::rule-matched probe tells it
      to dtrace(1), for up to seconds (10) or packets (100), whichever
      ends first.  json: {"packets":[...],"seconds","limit"}, each
      with ms (since it began), verdict (pass, deny, divert, tee,
      dummynet, netgraph, ngtee, nat, reass, nat64), family, source,
      destination, proto, sport, dport, rule (its number), interface
      and direction (in or out).  With jail, of a jail's own firewall
      (vnet): the packets on the jail's interfaces.  It needs
      dtraceall(4) loaded.
    do:
      request:
        attributes:
          - jail
          - net-filter
          - seconds
          - packets
        required:
          - net-filter
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: network-parts
    attribute-set: arcana
    auth: true
    doc: |
      The routes, connections or sockets as network's dump has them,
      as a stream: each data message a part, the routes typed and the
      rest as JSON, total in each; the host half-closes it once all
      were sent, or closes it with why not.  A part is sent only when
      the reader has room for it, which it gives back as it takes
      them: over SCTP the stream shares the association with whatever
      else asks the host at once, and a slow reader holds nothing but
      its own stream.
    do:
      request:
        attributes:
          - net-kind
          - net-family
          - net-filter
          - net-fib
          - jail
        required:
          - net-kind
      reply:
        attributes:
          - ok

  - name: sysctl-parts
    attribute-set: arcana
    auth: true
    doc: |
      The kernel's state as sysctl's dump has it, as a stream: each
      data message a part, json the next values.  As network-parts.
    do:
      request:
        attributes:
          - net-filter
      reply:
        attributes:
          - ok

  - name: zfs-send
    attribute-set: arcana
    auth: true
    doc: |
      zfs send of a snapshot, the first of names, as a stream: each
      data message the next bytes it wrote; with a second name, a
      snapshot of the same dataset, only what changed since that one
      (-i); with recursive, the datasets under it too (-R).  The host
      half-closes it once send ended well, or closes it with what send
      said.  For another host's zfs-receive, whatever carries the
      bytes between them: the console does.
    do:
      request:
        attributes:
          - names
          - zfs-recursive
      reply:
        attributes:
          - ok

  - name: zfs-receive
    attribute-set: arcana
    auth: true
    doc: |
      zfs receive -u into the dataset that names names, as a stream:
      each data message the next bytes of what zfs send wrote, given
      to receive only as fast as it reads them.  Half-closed by the
      sender once all was sent; the host closes it once receive ended,
      with nothing when it did well, with what it said when not.  A
      dataset is never overwritten (no -F), nor a pool's own received
      into.
    do:
      request:
        attributes:
          - names
      reply:
        attributes:
          - ok

  - name: source-head
    attribute-set: arcana
    auth: true
    doc: |
      The commit at the head of a repository's branch (ref, or its
      default), as git ls-remote tells it, fetched as agent-build
      fetches: over SSH with the host keys a person confirmed, never
      one taken on trust.  Nothing is cloned or built.
    do:
      request:
        attributes:
          - source
          - ref
          - host-keys
          - ssh-key
        required:
          - source
      reply:
        attributes:
          - ok
          - error
          - commit
          - host-keys
          - fingerprints
          - deploy-key
          - trace

  - name: source-log
    attribute-set: arcana
    auth: true
    doc: |
      What is new in a repository's branch: its latest commits (count,
      100 unless said), newest first, each its hash, time, subject and
      body, and its tags with their messages, the release notes where
      there are any.  A bare clone without the files (blob:none) is
      kept in the build directory as log.git and fetched again each
      time, over SSH as agent-build fetches.  Nothing is built.
    do:
      request:
        attributes:
          - source
          - ref
          - host-keys
          - ssh-key
          - count
        required:
          - source
      reply:
        attributes:
          - ok
          - error
          - commit
          - log
          - tags
          - host-keys
          - fingerprints
          - deploy-key
          - trace

  - name: traceroute
    attribute-set: arcana
    auth: true
    doc: |
      One round of traceroute(8), or traceroute6(8), from this host to
      an address: a probe for each hop, numeric, a second's wait each,
      30 hops at most.  A JSON object with "address", "family", "hops"
      (each with its "ttl" and the "address" that answered, its "rtt"
      in milliseconds and what traceroute noted of it, or "lost") and
      "reached".  The console asks again and again, as mtr(8) does.
    do:
      request:
        attributes:
          - lookup
        required:
          - lookup
      reply:
        attributes:
          - ok
          - error
          - json
          - trace
  - name: sdwan-probes
    attribute-set: arcana
    auth: true
    doc: |
      The tunnels the agent is to measure from now on, as the console
      has an SD-WAN edge measure them (Mplify 119 §11.4): json, an
      array of targets, each with its "id" and "address", and maybe
      "fib" (the table it is reached by, 0), "interval" (ms between
      two probes, 100), "size" (bytes, 64), "count" (probes, 0 for
      without end), "dscp" (0), "down" and "up" (misses in a row that
      make it down, 3; answers that make it up, 3), "timeout" (ms,
      1000), "eval" (ms of one sample, 1000), "history" (samples kept,
      3600), "report" and "tca" (thresholds a metric: "delay" and
      "ipdv" in ms, "loss" a fraction, and "damping", intervals in a
      row, 1; a metric over its threshold is a fault, tca, cleared
      under it again).  Kept for the next start.  An empty array
      stops them all.  Each is ICMP echo on a raw socket: root.
    do:
      request:
        attributes:
          - json
        required:
          - json
      reply:
        attributes:
          - ok
          - error
          - trace
  - name: sdwan
    attribute-set: arcana
    auth: true
    doc: |
      What the probes have seen, as a JSON object: "targets", each
      with its id, address, family, fib, state (unknown, up, down,
      ended, error, with error why), since (when the state began),
      interval, size, eval, dscp, sent, received, misses (in a row),
      last_rtt (ms), "now" (the sample in progress: sent, recv, delay,
      ipdv, loss, age) and "samples", the last kept, the oldest
      first (with after, only those after that time), each an array
      of the time, the one-way delay (ms, half
      the mean round trip), the delay variation (ms), the loss ratio,
      the least and the most, and the probes sent and answered; and
      "probing", whether the thread runs.  A target that goes down or
      comes up is an event, sdwan-tunnel, with its id, address, state
      and misses.
    do:
      request:
        attributes:
          - after
      reply:
        attributes:
          - ok
          - error
          - json
          - trace
  - name: sdwan-rules
    attribute-set: arcana
    auth: true
    doc: |
      The rules that classify what comes in at the SD-WAN UNIs and
      steer it, as the console compiles them: json, an object with
      "set" (2 to 31, the ipfw set they live in, emptied and filled
      while disabled), "tables" (each a "name", a "valtype" of skipto,
      ipv4, ipv6 or legacy, and "entries", each a prefix and a value),
      "objects" (dummynet pipes and queues and nat instances the rules
      name: each "pipe N config ...", "queue N config ...", "sched N
      config ..." or "nat N config ...", made before the rules, deleted
      with them, their modules loaded) and "rules" (each its number and
      its words).  Kept for the next start.  With no rules, the set is
      emptied.
    do:
      request:
        attributes:
          - json
        required:
          - json
      reply:
        attributes:
          - ok
          - error
          - trace
  - name: sdwan-steer
    attribute-set: arcana
    auth: true
    doc: |
      What the policy tables of the rules hold: json, an object with
      "entries", each a "table", a "prefix" and its "candidates", each
      a tunnel's "id" (as the probes know it) and the address it goes
      "via", in the console's order.  The first whose far end the
      probes do not say is down is the one, made again here when a
      probe's state changes.  Kept for the next start.
    do:
      request:
        attributes:
          - json
        required:
          - json
      reply:
        attributes:
          - ok
          - error
          - trace

  - name: sdwan-bird
    attribute-set: arcana
    auth: true
    doc: |
      The BIRD instances of the SD-WAN services at this edge, one each,
      as the console writes them: json, an object with "instances",
      each a "name", the "fib" it runs in and its "conf", BIRD's
      configuration text.  Each file is parsed by bird(8) before it is
      made the instance's; one running is told to read it again, one
      not yet is started in its table (setfib) with a control socket
      and a pid file of its own beside the agent's kept files; those
      not named any more are stopped.  Kept for the next start.  The
      sdwan read tells each instance and its protocols.
    do:
      request:
        attributes:
          - json
        required:
          - json
      reply:
        attributes:
          - ok
          - error
          - trace

  - name: sdwan-dhcp
    attribute-set: arcana
    auth: true
    doc: |
      The DHCP servers of the SD-WAN services at this edge (dnsmasq,
      one instance per service, in its table), as the console writes
      them: json, an object with "instances", each a "name", the "fib"
      it runs in and its "conf", dnsmasq's configuration text, to which
      the agent adds the pid and lease files.  Each is checked by
      dnsmasq --test before it is made the instance's; one running is
      stopped and started again on it, one not yet is started in its
      table (setfib); those not named any more are stopped.  Kept for
      the next start.  The sdwan read tells each instance and the
      leases it gave.
    do:
      request:
        attributes:
          - json
        required:
          - json
      reply:
        attributes:
          - ok
          - error
          - trace

  - name: sdwan-dns
    attribute-set: arcana
    auth: true
    doc: |
      The DNS filters of the SD-WAN services at this edge (MEF 88: the
      base system's unbound, local-unbound, one instance per service,
      in its table), as the console writes them: json, an object with
      "instances", each a "name", the "fib" it runs in and its "conf",
      unbound's configuration text, to which the agent adds the pid
      file.  Each is checked by local-unbound-checkconf before it is
      made the instance's; one running is stopped and started again on
      it, one not yet is started in its table (setfib); those not
      named any more are stopped.  Kept for the next start.  The sdwan
      read tells each instance.
    do:
      request:
        attributes:
          - json
        required:
          - json
      reply:
        attributes:
          - ok
          - error
          - trace

  - name: sdwan-proxy
    attribute-set: arcana
    auth: true
    doc: |
      The proxies of the SD-WAN services at this edge (MEF 88's
      url-filter: Squid, a plugin the host has installed, one instance
      per service in its table), as the console writes them: json, an
      object with "instances", each a "name", the "fib" it runs in,
      its "mode" (sni, the TLS names looked at and nothing opened;
      inspect, TLS opened with a CA of the instance's own), its "conf",
      Squid's configuration text with @PID@, @CA@, @SSLDB@, @CERTGEN@
      and @DENY@ for what the agent places, and "deny", the domains
      denied, one a line.  The CA is made by the agent, openssl(1),
      once per instance and kept; its certificate is in the sdwan read
      for the clients to trust where TLS is opened.  Each file is
      checked by squid -k parse before it is made the instance's; one
      running is told to reconfigure, one not yet is started in its
      table (setfib); those not named any more are stopped.  Kept for
      the next start.
    do:
      request:
        attributes:
          - json
        required:
          - json
      reply:
        attributes:
          - ok
          - error
          - trace

  - name: sdwan-ids
    attribute-set: arcana
    auth: true
    doc: |
      The intrusion detection of the SD-WAN services at this edge (the
      ids criterion, Arcana's own: Suricata, a plugin the host has
      installed, one instance per service), as the console writes them: json, an
      object with "instances", each a "name", the "interfaces" it
      watches (the service's UNIs here), its "conf", Suricata's YAML
      with @LOGDIR@, @RULES@ and @PID@ for what the agent places,
      "rules", the service's own rules, one a line, and "divert", a
      port, for one that prevents: it is run on that port (-d), where
      the console's ipfw divert rules hand it the UNIs' packets, rather
      than by libpcap; while it is not running they pass nothing, a
      Critical fault (ids) until it runs again.  Each is checked by
      suricata -T before it runs; one whose files changed is started
      again; those not named any more are stopped.  The alerts each
      writes (eve.json) are read every second into events, sdwan-ids,
      and kept, the latest in the sdwan read.  Kept for the next start.
    do:
      request:
        attributes:
          - json
        required:
          - json
      reply:
        attributes:
          - ok
          - error
          - trace

  - name: jail-files
    attribute-set: arcana
    auth: true
    doc: |
      The files jails are made with, as the jail-conf job writes them,
      as a JSON object: "defaults", the file every jail includes (its
      "path" and "text", text null when there is none); "dir", where
      the jails' files are; "templates", each a "name" and its
      "text"; and "jails", each jail file there with its "name" and
      "text".  Files of 64 KiB and less.
    do:
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: certs
    attribute-set: arcana
    auth: true
    doc: |
      The certificates OpenSSL trusts, of the host or of jail, as a JSON
      object: "trusted", each of /etc/ssl/certs, and "untrusted", each of
      /etc/ssl/untrusted, with its "file", "subject", "cn", "org",
      "country", "issuer", "not_before" and "not_after" (seconds of the
      epoch), "sha256", "key", "ca", "self_signed", and "local", the
      path of the copy of it the host was given, when it was; and
      "localbase", "added_dir", "distrusted_dir", "certctl" (whether
      there is one) and "now".
    do:
      request:
        attributes:
          - jail
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: ssh
    attribute-set: arcana
    auth: true
    doc: |
      The base system's sshd, of the host or of jail, as a JSON object:
      "settings", what sshd -T says of those that matter here, each key
      an array of values ("settings_from_file" says why they are the
      file's instead); "banner_text"; "host_keys", each with its "path",
      "type", "bits", "fingerprint", "comment" and its "certificate"
      ("kind", "id", "principals", "valid_after", "valid_before", -1 for
      forever, "ca", the signing key's fingerprint) and whether
      "certificate_used"; "users", those who may sign in, each with
      "name", "uid", "home", "shell", "keys_file" and "keys" (each
      "type", "fingerprint", "bits", "comment", "options"); "user_cas";
      "before_kept".
    do:
      request:
        attributes:
          - jail
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: capture
    attribute-set: arcana
    auth: true
    doc: |
      Packets taken with tcpdump(1) off interface, of the host or of
      jail's own network (vnet): an interface, a bridge's span port, or
      a bpf(4) tap, as ipfw's per-rule ipfw<number> of a rule with log
      (logdst bpf).  net-filter is a pcap-filter(7) expression; packets
      (50, 500 at most) or seconds (10, 60 at most), whichever ends
      first.  json: "source", "filter", "lines" (tcpdump -n -tttt's,
      one a packet), "packets", "limit", "seconds", "timed_out",
      "bytes" and "pcap", the capture as a pcap file in base64.
      Without interface, "sources", what tcpdump -D lists.
    do:
      request:
        attributes:
          - jail
          - interface
          - net-filter
          - seconds
          - packets
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: zfs-key
    attribute-set: arcana
    auth: true
    doc: |
      The key of an encrypted dataset whose keylocation is prompt, as
      it is typed: with zfs-key, loaded (zfs load-key, which reads it
      on its standard input, through a pipe); with zfs-new-key, changed
      (zfs change-key, the same), and loaded first with zfs-key when it
      is not.  A key is on no disk, in no job, no trace and no log.
    do:
      request:
        attributes:
          - zfs-dataset
          - zfs-key
          - zfs-new-key
        required:
          - zfs-dataset
      reply:
        attributes:
          - ok
          - error
          - trace

  - name: tls
    attribute-set: arcana
    auth: true
    doc: |
      The host's own TLS files, those of -A, -C and -K, renewed without
      a restart.  status: a JSON object of "cert" (its "subject",
      "issuer", "not_before", "not_after", "sha256" and "chain", the
      CAs sent after it), "ca" (each trusted CA, the same fields) and
      "pending" (whether a key waits for its certificate).  csr: a new
      EC P-256 key made beside the host's key (.next, 0600), never
      sent, and a certificate request for it, "csr" of the JSON.
      install: with tls-cert, a certificate for that waiting key, which
      becomes the host's with it; with tls-ca, the CAs to trust; either
      or both, the files before kept beside (.before), then read again
      for the connections made from now on (open ones keep theirs).
      tls-peer must be the asking console's own certificate, and it
      must still be trusted with what is installed: nothing locks the
      console out.  What fails puts the files back.
    do:
      request:
        attributes:
          - tls-verb
          - tls-cert
          - tls-ca
          - tls-peer
        required:
          - tls-verb
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: step
    attribute-set: arcana
    mcgrp: steps
    doc: |
      A step of what a request of the peer's own does, told while the
      request runs: when the step begins (status incomplete, a program's
      command line as its label) and again when it ends, with its status,
      duration, exit and output.  Sent on the connection that made the
      request, and only when it subscribed to steps; the reply carries
      the whole trace as ever.  trace holds the one step, its id its
      place in the trace.
    event:
      attributes:
        - trace

  - name: config-export
    attribute-set: arcana
    auth: true
    doc: |
      All that makes the host what it is, as a JSON object, to keep or to
      make another host the same with (config-apply): "arcana" is
      "host", "format" 1; "host", "agent" (its version) and "taken";
      "facts", what the hardware and the system are (arch, release,
      cpu, ncpu, memory, "interfaces": each physical one's name, driver
      and MAC, a cloned one is configuration, "disks": each name and
      size); "packages", those installed by hand (pkg query, not the
      automatic ones), each name, origin and version; "files", each
      configuration file there is of those Arcana manages (rc.conf and
      rc.conf.d, loader.conf, sysctl.conf, jail.conf and jail.conf.d,
      fstab, hosts, resolv.conf, ntp.conf, rtadvd.conf, sshd_config,
      devfs.rules, syslog.conf, the agent's ipfw.rules and history.conf,
      bird.conf, swanctl's, WireGuard's, dnsmasq's), its path, mode,
      owner, group and text; a secret's text only with secrets, else
      "secret": true without it.  The agent's own keys and certificates
      never: a host's identity is its own.  Jails' and datasets' data
      are not configuration: zfs-send carries them.
    do:
      request:
        attributes:
          - secrets
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: config-apply
    attribute-set: arcana
    auth: true
    doc: |
      A bundle of config-export's made this host's configuration.  First
      the hardware: each physical interface and disk the bundle names
      has to be here, and the arch the same, else nothing is done
      unless anyway.  json says "mismatches" (what is not), "files"
      (each path, "state" same, changed, new or withheld, a secret the
      bundle does not carry, which stays as it is, and "diff", a
      unified diff, for one changed), "packages" (those the bundle has
      that this host does not: Arcana installs none by itself), and,
      when it was done, "backup", where the files before are kept
      (/var/backups/arcana/config-<time>), "applied" and "reboot": what
      the files say takes hold at boot.  new-hostname puts that in
      rc.conf's hostname instead.  With dry-run only the report.
    do:
      request:
        attributes:
          - bundle
          - dry-run
          - anyway
          - new-hostname
        required:
          - bundle
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

  - name: path-check
    attribute-set: arcana
    auth: true
    doc: |
      What this host does with a packet from path-src to path-dst (of
      path-proto, to path-port), and with its reply, without one being
      sent: as a JSON object, "host" and "addresses" (each of the host's
      own, its interface, prefix and the interface's FIB), whether the
      source and the destination are the host's or on a network it is
      on ("src", "dst"), "forwarding" (net.inet.ip.forwarding and its
      IPv6 twin), "ingress" (the interface it comes in on: interface if
      given, else the one the route back to the source is by), "fib",
      "route" (the route to the destination: the send route, as
      route-lookup's best, or none), "neighbor" (the next hop's ARP or
      NDP entry), "return" (the route back to the source from where the
      reply comes in: the receive route, and "symmetric", whether it is
      by the interface the request came in on), "firewall" (ipfw's
      ruleset walked for the request in and out and the reply in and
      out, each "verdict", "rule", "text", "by_state", what it could not
      judge, "setfib", "fwd"), and "findings", each "severity" (bad,
      warn, info, ok) and "what", in words.  With jail, of a vnet
      jail's own network.  Nothing is sent, nothing is changed.
    do:
      request:
        attributes:
          - path-src
          - path-dst
          - path-proto
          - path-port
          - interface
          - net-fib
          - jail
        required:
          - path-src
          - path-dst
      reply:
        attributes:
          - ok
          - error
          - json
          - trace

mcast-groups:
  - name: events
    auth: true
    doc: The host's events, each as it happens (event).
  - name: steps
    auth: true
    doc: |
      The steps of the peer's own requests as they run (step), on its
      own connection only.

streams:
  - name: network-parts
    open: network-parts
    direction: bidirectional
    payload: part
    initial-credit: 2097152
  - name: sysctl-parts
    open: sysctl-parts
    direction: bidirectional
    payload: part
    initial-credit: 2097152
  - name: zfs-send
    open: zfs-send
    direction: bidirectional
    payload: chunk
    initial-credit: 4194304
  - name: zfs-receive
    open: zfs-receive
    direction: bidirectional
    payload: chunk
    initial-credit: 4194304
