# The kinds of job, as the console's API takes them (POST
# /api/servers/<id>/jobs, and a workflow's steps): what each needs,
# what else it uses, the values some fields are one of, and whether it
# destroys: always, or with which verbs.  Beside arcana.yaml, whose
# job-spec they are made into: the console's checks of a workflow's
# steps and the page's forms for them come from here (jobs.awk), so a
# new kind is one more entry.  A line is "key: words", the words with
# spaces between them.  Every kind is one of arcana.yaml's job-kind and
# every field an attribute of its job-spec, by the same name with - for
# _ or the one its attribute says: the build stops otherwise.

fields:
  - field: jail
    type: text
    label: Jail
    help: The jail it is done in; empty for the host itself.
    picker: jail
  - field: action
    type: text
    label: Action
    help: What is done to it.
  - field: address
    type: text
    label: Address
    help: An address with its prefix: 192.0.2.1/24, 2001:db8::1/64.
  - field: interface
    type: text
    label: Interface
    help: Its name on the host: em0, wg0, bridge0.
    picker: interface
  - field: service
    type: text
    label: Service
    help: An rc.d script of the host or jail: nginx, sshd.
    picker: service
  - field: destination
    type: text
    label: Destination
    help: A network, or default: 10.0.0.0/8, default.
  - field: gateway
    type: text
    label: Gateway
    help: The next hop: an address, or an interface.
  - field: tunnel_local
    type: text
    label: Tunnel, this end
  - field: tunnel_remote
    type: text
    label: Tunnel, the far end
  - field: parent
    type: text
    label: Parent interface
  - field: verb
    type: text
    label: Verb
  - field: args
    type: list
    label: Arguments
    help: Words, a space between them, as the job takes them.
    attribute: names
  - field: packages
    type: list
    label: Packages
    help: Package names, a space between them; empty for every one installed.
    attribute: names
  - field: set
    type: map
    label: Variables to set
    help: One NAME=value a line.
    attribute: variables
  - field: unset
    type: list
    label: Variables to unset
    attribute: variables
  - field: source
    type: text
    label: Source address
  - field: peer
    type: text
    label: Peer key
  - field: endpoint
    type: text
    label: Endpoint
  - field: allowed_ips
    type: text
    label: Allowed addresses
  - field: keepalive
    type: number
    label: Keepalive, seconds
    help: Seconds between keepalives; empty for none.
  - field: listen_port
    type: number
    label: Port
    help: A UDP port, 1 to 65535.
  - field: description
    type: text
    label: Description
  - field: mtu
    type: number
    label: MTU
    help: Bytes; empty for the interface's own.
  - field: fib
    type: number
    label: Routing table
    help: A routing table, 0 the default (setfib(1)).
  - field: tunnelfib
    type: number
    label: Routing table of the tunnel's outer packets
  - field: metric
    type: number
    label: Metric
  - field: weight
    type: number
    label: Weight
  - field: id
    type: number
    label: Tag or identifier
  - field: reqid
    type: number
    label: reqid
  - field: up
    type: bool
    label: Up
  - field: remove
    type: bool
    label: Remove
    help: Taken away, rather than added.
  - field: live
    type: bool
    label: Live
    help: Done in the running system, now.
  - field: persist
    type: bool
    label: Kept for a boot
    help: Kept in the configuration, so it is there after a reboot.
  - field: safe
    type: bool
    label: Safe, undone unless confirmed
    help: Undone by itself unless confirmed, in case the host is lost by it.
  - field: recursive
    type: bool
    label: Recursive
  - field: force
    type: bool
    label: Force
    help: Done even where pkg or the tool would refuse.
  - field: pkg_ip
    type: number
    label: pkg's network
    help: Which way pkg reaches its repository.
    choices: 4=IPv4 only (pkg -4)|6=IPv6 only (pkg -6)
  - field: pkg_repo
    type: text
    label: Repository
    help: Only from this one of pkg's repositories (pkg -r); empty, from where pkg's configuration has each package.
  - field: conn
    type: text
    label: Connection
  - field: ipsec_mode
    type: text
    label: Mode
    help: tunnel wraps whole packets; transport protects the hosts' own.
  - field: pubkey
    type: text
    label: Peer's public key
  - field: local_ts
    type: text
    label: This side's traffic
  - field: remote_ts
    type: text
    label: The peer's traffic
  - field: start_action
    type: text
    label: Started
  - field: local_id
    type: text
    label: This side's identity
  - field: remote_id
    type: text
    label: The peer's identity
  - field: child
    type: text
    label: Child
  - field: local_cert
    type: text
    label: This host's certificate (x509)
  - field: remote_cert
    type: text
    label: The peer's certificate (x509)
  - field: remote_ca
    type: text
    label: The peer's CA (x509ca)
  - field: dataset
    type: text
    label: Dataset
  - field: snapshot
    type: text
    label: Base snapshot
  - field: copy
    type: text
    label: Copied by
  - field: path
    type: text
    label: Path
  - field: text
    type: text
    label: The file
  - field: start
    type: bool
    label: Started once made
  - field: preshared_key
    type: text
    label: Preshared key
  - field: lladdr
    type: text
    label: Link address
  - field: temporary
    type: bool
    label: Ages out
  - field: user
    type: text
    label: User
    help: A user of the host who signs in.

kinds:
  - kind: jail-action
    title: A jail started, stopped, restarted or killed
    needs: jail action
    values: action=start|stop|restart|kill
  - kind: address
    title: An address of a jail
    needs: jail address
    uses: interface remove live persist
  - kind: service-action
    title: A service started, stopped, reloaded, enabled or disabled
    needs: service action
    values: action=start|stop|restart|reload|enable|disable
  - kind: service-config
    title: A service's variables in rc.conf
    needs: service
    uses: set unset
  - kind: pkg-upgrade
    title: Packages upgraded
    uses: jail packages force pkg_ip pkg_repo
  - kind: if-address
    title: An interface's address added or taken off
    needs: interface address
    uses: jail remove live persist safe
  - kind: if-state
    title: An interface brought up or down
    needs: interface up
    uses: jail persist safe
  - kind: route
    title: A static route added or deleted
    needs: destination
    uses: jail gateway remove fib metric weight source persist safe
  - kind: if-set
    title: An interface's MTU, description, routing tables or addressing
    needs: interface
    uses: jail mtu description fib tunnelfib addressing persist safe
  - kind: if-create
    title: An interface made
    needs: interface
    uses: jail tunnel_local tunnel_remote address destination description mtu fib tunnelfib id parent reqid persist
  - kind: if-destroy
    title: An interface destroyed
    needs: interface
    uses: jail persist
    destroys: always
  - kind: netgraph
    title: The netgraph graph changed
    needs: verb args
    uses: jail
    values: verb=mkpeer|connect|rmhook|shutdown|name
    destroys: verb=rmhook|shutdown
  - kind: wireguard
    title: A WireGuard interface's key or peers
    needs: interface verb
    uses: jail peer endpoint allowed_ips keepalive listen_port persist preshared_key
    values: verb=init|peer|unpeer
  - kind: bird
    title: BIRD told something
    needs: verb
    uses: jail args
    values: verb=enable|disable|restart|reload|configure
  - kind: if-vnet
    title: An interface given to a jail, or taken back
    needs: interface jail
    uses: remove parent persist
  - kind: kmod
    title: A kernel module loaded or unloaded, or kept in kld_list or not
    needs: verb args
    uses: persist
    values: verb=load|unload|keep|forget
  - kind: ntp
    title: The NTP servers the host keeps time by
    needs: args
    uses: remove persist
    destroys: remove
  - kind: rtadvd
    title: Router advertisements on an interface, for SLAAC
    needs: interface args
    uses: remove persist
    destroys: remove
  - kind: ipsec-sa
    title: Manually keyed IPsec security associations
    needs: verb interface
    uses: reqid tunnel_local tunnel_remote args
    values: verb=key|set|derive|commit|clear
    destroys: verb=clear
  - kind: zfs
    title: zfs
    needs: verb args
    uses: recursive force
    destroys: verb=destroy|rollback
  - kind: zpool
    title: zpool
    needs: verb args
    uses: force
    destroys: verb=destroy|export|offline|detach|remove|replace|labelclear
  - kind: mount
    title: A file system mounted, unmounted or swapped on
    needs: verb args
    uses: force
  - kind: gpart
    title: A partition table or partition
    needs: verb args
    uses: force
    destroys: verb=destroy|delete|newfs|newfs-msdos
  - kind: cam
    title: camcontrol
    needs: verb args
  - kind: sysctl
    title: A sysctl set
    needs: args
    uses: persist
  - kind: ipfw
    title: The firewall
    needs: verb args
    uses: jail persist safe
    destroys: verb=delete|flush|replace
  - kind: bridge
    title: A bridge
    needs: verb args
    uses: jail persist
  - kind: geneve
    title: A geneve tunnel
    needs: verb args
    uses: jail persist
  - kind: process
    title: A process signalled or reniced
    needs: verb args
    values: verb=signal|renice
    destroys: verb=signal
  - kind: pkg-clean
    title: The package cache cleaned
    uses: jail force
  - kind: ipsec
    title: IPsec, strongSwan
    needs: verb
    uses: jail conn child tunnel_local tunnel_remote ipsec_mode pubkey local_cert remote_cert remote_ca local_ts remote_ts reqid start_action local_id remote_id persist
    values: verb=init|start|conn|unconn|child|unchild|up|down ipsec_mode=tunnel|transport start_action=start|trap|none
    destroys: verb=unconn|unchild
  - kind: pkg-install
    title: Packages installed
    needs: packages
    uses: jail force pkg_ip pkg_repo
  - kind: jail-conf
    title: A jail made, removed; the jails' defaults or a template
    needs: verb
    uses: jail dataset snapshot copy path text start args
    values: verb=make|remove|defaults|template|untemplate|edit copy=clone|send
    destroys: verb=remove|untemplate
  - kind: carp
    title: A carp(4) address shared with other hosts, its vhid set, or taken away
    needs: verb interface
    uses: jail address args preshared_key persist safe
    values: verb=add|set|remove
    destroys: verb=remove
  - kind: neighbour
    title: An ARP or NDP neighbour set by hand, or taken away
    needs: verb address
    uses: jail lladdr temporary live persist
    values: verb=add|delete
    destroys: verb=delete
  - kind: cert
    title: A certificate OpenSSL trusts, added, taken away, trusted or not
    needs: verb
    uses: jail path text
    values: verb=add|remove|trust|untrust|rehash
    destroys: verb=remove
  - kind: ssh
    title: The base system's sshd: its banner, settings, keys and host certificates
    needs: verb
    uses: jail path args text user safe
    values: verb=banner|set|authorize|unauthorize|options|sign|user-cas
    destroys: verb=unauthorize
  - kind: poudriere
    title: poudriere's build jails, ports trees and builds
    needs: verb
    uses: args text
    values: verb=jail-create|jail-update|jail-delete|ports-create|ports-update|ports-delete|bulk|stop|make-conf|conf|options
    destroys: verb=jail-delete|ports-delete
  - kind: clamav
    title: freshclam's mirrors of ClamAV's signatures
    needs: verb
    uses: args text
    values: verb=mirrors
  - kind: suricata
    title: Suricata's ruleset fetched by suricata-update, its rules set
    needs: verb
    uses: args
    values: verb=update|rule
