# loader.conf's lines, each as the loader reads it.
autoboot_delay="3"
beastie_disable=YES
spaced   =   "a b"   # a comment
word=a-b.c_d
quoted_hash="a#b"
esc="a\\b\$c"
computed="${autoboot_delay}x"
computed2="$beastie_disable"
if_bridge_load="yes"
mod_name="/boot/x \\y"
kern.geom.label.disk_ident.enable="0"
hw.em.rxd=4096
exec="echo x"
bad line here
also_bad="x" junk
-dash="x"
open_quote="abc
dup="1"
dup="2"
crlf="v"
	  indented="yes"
noeol="end"