# sh(1)'s reading of a file of assignments, each case's value checked
# against what sh(1) gives it.
plain=YES
dq="a b  c"	# a comment after it
sq='single $not expanded'
mixed="a"'b'c
empty=
emptyq=""
esc_dq="a\"b\\c\$d\`e"
esc_un=a\ b\#c
bs_other="a\nb"
hash_in=a#b
multi="one
two
three"
cont="con\
tinued"
cont_un=con\
tinued_too
two=1 three=2
semi=1; semi2=2
tab_lead=lead
	  indented="yes"
computed="${plain}x"
computed2=$plain
computed3=`echo x`
computed4="$(echo ")")"
tilde=~/x
tilde2=a:~/y
nottilde=a~b
dollar_lit="a$"
dollar_lit2="$ x"
cmdenv=1 true
if [ -n "$plain" ]; then
	inif=1
fi
f() {
	infn=1
}
case x in
x) incase=1 ;;
esac
while false; do inloop=1; done
amp=1 && amp2=2
cat >/dev/null <<EOF
heredoc_var=1
EOF
after_heredoc=ok
cat >/dev/null <<-'END'
	hd2=1
	END
last=one
last=two
noeol=end