# A host's rc.conf, as an installer and an administrator leave one.
hostname="gw.example.org"
keymap="us.kbd"
ifconfig_em0="DHCP"
ifconfig_em1="inet 192.0.2.1/24"
ifconfig_em1_alias0="inet 192.0.2.2/32"
ifconfig_em1_ipv6="inet6 2001:db8::1/64"
cloned_interfaces="bridge0 epair0 lo1"
ifconfig_bridge0="addm em1 up"
defaultrouter="192.0.2.254"
ipv6_defaultrouter="2001:db8::fe"
static_routes="lan2 lan3"
route_lan2="-net 198.51.100.0/24 192.0.2.10"
route_lan3="-net 203.0.113.0/24 -interface em1"
gateway_enable="YES"
sshd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"

# Set dumpdev to "AUTO" to enable crash dumps, "NO" to disable
dumpdev="AUTO"
zfs_enable="YES"
jail_enable="YES"
jail_list="web db"
pf_enable="NO"	# pf.conf is not ready
